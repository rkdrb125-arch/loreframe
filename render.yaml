
services:
  - type: web
    name: loreframe
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_SECRET
        generateValue: true
      - key: DB_PATH
        value: /tmp/loreframe.sqlite
