function createProject(){const name=(document.getElementById('project-new-name')?.value||'').trim();if(!name||name.length>80)return alert('세계관 이름을 1~80자로 입력해 주세요.');snapshotActiveProject();const p={id:id(),name,data:Object.fromEntries(PROJECT_KEYS.map(k=>[k,[]]))};db.projectSpaces.push(p);switchProject(p.id)}

/* v15: per-world theme, kept on project metadata rather than story records. */
const WORLD_THEME_PRESETS={
 lavender:{name:'라벤더 스튜디오',accent:'#6654c7',accent2:'#9582e6',surface:'#ffffff',background:'#f7f5fc',ink:'#28243f',hero:'#25213f'},
 sage:{name:'세이지 아카이브',accent:'#397e68',accent2:'#8bb8a2',surface:'#ffffff',background:'#f1f6f1',ink:'#263c34',hero:'#1e473c'},
 rose:{name:'로즈 에디토리얼',accent:'#b65e80',accent2:'#dca1b8',surface:'#fffdfd',background:'#fcf4f7',ink:'#452c3b',hero:'#4d2a40'},
 midnight:{name:'미드나이트',accent:'#b6a1e8',accent2:'#8574b4',surface:'#232b3a',background:'#171e2a',ink:'#f3f1fa',hero:'#101724'}
};
const WORLD_THEME_KEYS=['accent','accent2','surface','background','ink','hero'];
function validHex(v){return typeof v==='string'&&/^#[0-9a-f]{6}$/i.test(v)}
function activeWorld(){return (db.projectSpaces||[]).find(p=>p.id===db.activeProjectId)}
function worldTheme(){
 const p=activeWorld(),t=p?.theme||{};
 const preset=WORLD_THEME_PRESETS[t.preset]||WORLD_THEME_PRESETS.lavender;
 const colors={...preset};
 for(const key of WORLD_THEME_KEYS)if(validHex(t[key]))colors[key]=t[key];
 return {...colors,preset:t.preset||'lavender',image:typeof t.image==='string'?t.image:''};
}
function validThemeImage(v){
 if(!v)return '';
 try{const u=new URL(v);return ['https:','http:'].includes(u.protocol)&&v.length<=1500?v:''}catch{return ''}
}
function applyWorldTheme(){
 const t=worldTheme(),root=document.documentElement;
 for(const key of WORLD_THEME_KEYS)root.style.setProperty('--world-'+key,t[key]);
 const img=validThemeImage(t.image);
 document.body.style.backgroundImage=img?`linear-gradient(${t.background}dd,${t.background}e8),url("${img.replace(/["\\\n\r]/g,'')}")`:'none';
 document.body.style.backgroundSize=img?'cover':'';
 document.body.style.backgroundAttachment=img?'fixed':'';
 document.body.style.backgroundPosition=img?'center':'';
 const label=document.getElementById('world-theme-current');
 if(label)label.textContent=activeWorld()?.name||'';
}
function worldThemeStudio(){

 return `<div class="panel"><div class="section-kicker">WORLD / VISUAL IDENTITY</div><h2>🎨 세계관별 커스텀 테마</h2><p class="muted">현재 세계관 <b>${esc(p?.name||'')}</b>에만 적용됩니다. 다른 세계관으로 전환하면 그 세계관의 색상과 배경이 자동으로 복원됩니다.</p>
 <div class="world-theme-presets">${Object.entries(WORLD_THEME_PRESETS).map(([key,v])=>`<button type="button" class="world-theme-preset ${t.preset===key?'selected':''}" onclick="chooseWorldTheme('${key}')"><span style="background:${v.background};border-color:${v.accent}"><i style="background:${v.accent}"></i><i style="background:${v.accent2}"></i></span><b>${v.name}</b></button>`).join('')}</div>
 <form id="world-theme-form" data-preset="${esc(t.preset)}" onsubmit="event.preventDefault();saveWorldTheme()"><div class="grid">
 ${[['accent','포인트 컬러'],['accent2','보조 컬러'],['background','페이지 배경'],['surface','카드 배경'],['ink','본문 글자색'],['hero','상단 헤더']].map(([k,label])=>`<div><label for="world-color-${k}">${label}</label><div class="world-theme-color"><input type="color" id="world-color-${k}" value="${t[k]}" oninput="previewWorldTheme()"><code id="world-value-${k}">${t[k]}</code></div></div>`).join('')}
 </div><label for="world-theme-image">세계관 배경 이미지 URL (선택)</label><input id="world-theme-image" type="url" value="${esc(t.image)}" placeholder="https://example.com/background.jpg" maxlength="1500" oninput="previewWorldTheme()"><p class="formnote">HTTPS 이미지 링크를 권장합니다. 외부 이미지 호스트가 접근을 차단하면 표시되지 않을 수 있습니다. 이미지 파일 직접 업로드는 아직 지원하지 않습니다.</p>
 <div class="actions"><button class="primary" type="submit">💾 이 세계관 테마 저장</button><button type="button" onclick="resetWorldTheme()">기본 테마로 초기화</button><button type="button" onclick="go('projects')">세계관 목록</button></div></form></div>
 <div class="panel"><h3>미리보기</h3><div class="world-theme-preview" id="world-theme-preview"><div class="world-theme-preview-hero"><small>LOREFRAME · ${esc(p?.name||'WORLD')}</small><h2>인물의 내면을 읽고, 이야기를 남기다.</h2></div><div class="world-theme-preview-card"><b>✦ CHARACTER DOSSIER</b><p>프로필 · 심리 · 관계 · 서사가 한 공간에 이어집니다.</p><button type="button" class="primary" disabled>미리보기 버튼</button></div></div></div>`;
}
function readWorldThemeForm(){
 const t={preset:document.getElementById('world-theme-form')?.dataset.preset||activeWorld()?.theme?.preset||'lavender'};
 for(const k of WORLD_THEME_KEYS){const v=document.getElementById('world-color-'+k)?.value;if(validHex(v))t[k]=v}
 const raw=(document.getElementById('world-theme-image')?.value||'').trim();
 if(raw&&!validThemeImage(raw))throw Error('배경 이미지는 http 또는 https 주소만 사용할 수 있습니다.');
 t.image=raw;
 return t;
}
function previewWorldTheme(){
 try{
  const t=readWorldThemeForm();
  for(const k of WORLD_THEME_KEYS){document.documentElement.style.setProperty('--world-'+k,t[k]);const el=document.getElementById('world-value-'+k);if(el)el.textContent=t[k]}
  const preview=document.getElementById('world-theme-preview');
  if(preview){preview.style.background=t.background;preview.style.color=t.ink;preview.style.backgroundImage=t.image?`linear-gradient(${t.background}d9,${t.background}e9),url("${t.image.replace(/["\\\n\r]/g,'')}")`:'';preview.style.backgroundSize='cover'}
 }catch{}

function chooseWorldTheme(preset){
 if(!WORLD_THEME_PRESETS[preset])return;
 const t=WORLD_THEME_PRESETS[preset];
 const form=document.getElementById('world-theme-form');if(!form)return;
 form.dataset.preset=preset;
 for(const k of WORLD_THEME_KEYS){const el=document.getElementById('world-color-'+k);if(el)el.value=t[k]}
 document.querySelectorAll('.world-theme-preset').forEach(el=>el.classList.toggle('selected',el.getAttribute('onclick')===`chooseWorldTheme('${preset}')`));
 previewWorldTheme();
}
function saveWorldTheme(){
 const p=activeWorld();if(!p)return;
 try{p.theme=readWorldThemeForm();save();applyWorldTheme();render();alert('세계관 테마를 저장했습니다.')}catch(e){alert(e.message)}
}
function resetWorldTheme(){
 if(!confirm('이 세계관의 색상과 배경을 기본 라벤더 테마로 초기화할까요?'))return;
 const p=activeWorld();if(!p)return;delete p.theme;save();render();
}


/* v17 release audit: read-only checks; no automatic data repair. */
function qaRunChecks(){
 const issues=[],counts={};
 const spaces=Array.isArray(db.projectSpaces)?db.projectSpaces:[];
 const worldIds=new Set();
 for(const p of spaces){
  if(!p||!p.id){issues.push({level:'error',area:'세계관',message:'식별자가 없는 세계관이 있습니다.'});continue}
  if(worldIds.has(p.id))issues.push({level:'error',area:'세계관',message:`중복된 세계관 ID: ${p.name||p.id}`});
  worldIds.add(p.id);
  if(p.theme){
   for(const key of WORLD_THEME_KEYS)if(p.theme[key]!==undefined&&!validHex(p.theme[key]))issues.push({level:'warning',area:'테마',message:`${p.name||p.id}: ${key} 색상 형식이 올바르지 않습니다.`});
   if(p.theme.image&&!validThemeImage(p.theme.image))issues.push({level:'warning',area:'테마',message:`${p.name||p.id}: 배경 이미지 URL을 확인하세요.`});
  }
 }
 if(!worldIds.has(db.activeProjectId))issues.push({level:'error',area:'세계관',message:'현재 활성 세계관이 목록에 없습니다.'});
 const chars=Array.isArray(db.characters)?db.characters:[];
 const rels=Array.isArray(db.relations)?db.relations:[];
 const events=Array.isArray(db.events)?db.events:[];
 const ids=new Set(chars.map(c=>c.id)),relationIds=new Set(rels.map(r=>r.id)),eventIds=new Set(events.map(e=>e.id));
 const duplicates=(items,area)=>{const seen=new Set();for(const x of items){if(!x?.id)issues.push({level:'error',area,message:'ID가 없는 항목이 있습니다.'});else if(seen.has(x.id))issues.push({level:'error',area,message:`중복 ID: ${x.id}`});seen.add(x.id)}};
 duplicates(chars,'캐릭터');duplicates(rels,'관계');duplicates(events,'서사');
 for(const r of rels){
  if(!ids.has(r.a)||!ids.has(r.b))issues.push({level:'warning',area:'관계',message:`${r.id}: 존재하지 않는 캐릭터와 연결되어 있습니다.`});
 }
 for(const e of events){
  const refs=Array.isArray(e.characters)?e.characters:[e.character].filter(Boolean);
  for(const cid of refs)if(!ids.has(cid))issues.push({level:'warning',area:'서사',message:`${e.title||e.id}: 삭제되었거나 없는 등장인물 참조 (${cid})`});
  if(e.storyAnalysis&&!e.summary?.trim())issues.push({level:'warning',area:'AI 분석',message:`${e.title||e.id}: 원문 없이 AI 분석만 남아 있습니다.`});
 }
 const reviews=Array.isArray(db.integrationReviews)?db.integrationReviews:[];
 for(const r of reviews){
  if(!eventIds.has(r.eventId))issues.push({level:'warning',area:'AI 연결 검토',message:'삭제된 서사를 참조하는 검토 기록이 있습니다.'});
  for(const proposal of r.proposals||[]){
   if(proposal.kind==='character'&&!ids.has(proposal.targetId)||proposal.kind==='relation'&&!relationIds.has(proposal.targetId))
    issues.push({level:'warning',area:'AI 연결 검토',message:'삭제된 대상에 대한 수정 제안이 남아 있습니다.'});
  }
 }
 counts.worlds=spaces.length;counts.characters=chars.length;counts.relations=rels.length;counts.events=events.length;counts.reviews=reviews.length;
 return {issues,counts,checkedAt:new Date().toISOString()};
}
function qaDashboard(){
 const r=qaRunChecks(),errors=r.issues.filter(x=>x.level==='error'),warnings=r.issues.filter(x=>x.level==='warning');
 return `<div class="panel"><div class="section-kicker">RELEASE / QUALITY AUDIT</div><h2>🧪 LOREFRAME 품질 점검</h2><p class="muted">현재 활성 세계관의 데이터 연결과 전체 세계관의 테마 설정을 읽기 전용으로 확인합니다. 검사 과정에서 데이터를 수정하거나 외부 AI로 전송하지 않습니다.</p>
 <div class="statgrid"><div class="statcard"><small>세계관</small><div class="metric">${r.counts.worlds}</div></div><div class="statcard"><small>캐릭터</small><div class="metric">${r.counts.characters}</div></div><div class="statcard"><small>관계</small><div class="metric">${r.counts.relations}</div></div><div class="statcard"><small>서사</small><div class="metric">${r.counts.events}</div></div></div>
 <div class="qa-status ${errors.length?'qa-error':warnings.length?'qa-warning':'qa-good'}">${errors.length?'⚠️ 데이터 구조 오류 '+errors.length+'건':warnings.length?'🔎 확인 권장 '+warnings.length+'건':'✓ 검사 항목에서 문제를 찾지 못했습니다.'}</div>
 ${r.issues.length?`<div class="qa-issues">${r.issues.slice(0,100).map(i=>`<div class="item"><b>${i.level==='error'?'오류':'주의'} · ${esc(i.area)}</b><p>${esc(i.message)}</p></div>`).join('')}${r.issues.length>100?`<p class="muted">총 ${r.issues.length}건 중 100건만 표시합니다. 전체 결과는 JSON으로 저장해 주세요.</p>`:''}</div>`:'<p class="muted">참조 무결성 검사에서 발견된 문제가 없습니다. 실제 AI API 호출이나 브라우저 호환성까지 검증했다는 의미는 아닙니다.</p>'}
 <div class="actions"><button class="primary" onclick="render()">다시 점검</button><button onclick="qaDownloadReport()">검사 결과 JSON 저장</button><button onclick="go('backup')">데이터 백업으로 이동</button></div></div>
 <div class="panel"><h3>배포 전 확인할 항목</h3><p class="muted">① 기존 데이터 JSON 백업 → ② 로그인 및 클라우드 저장 상태 확인 → ③ 캐릭터/관계/서사 생성과 수정 → ④ AI 제공업체 연결 및 제안 승인 → ⑤ 세계관 전환과 테마 복원 → ⑥ 모바일 화면 확인</p><p class="muted">정식 안정화 점검: 로그인 → 캐릭터 등록 → 관계 저장 → 서사 작성 → AI 분석 → 승인 → 백업 다운로드 → 별도 테스트 계정에서 복원 순서로 확인하세요. 이 페이지의 점검은 현재 브라우저 데이터에 대한 정적 검증입니다. 자동 복구나 서버 상태 진단 기능은 포함하지 않습니다.</p></div>`;
}
function qaDownloadReport(){
 const report=qaRunChecks();
 const blob=new Blob([JSON.stringify(report,null,2)],{type:'application/json'});
 const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='LOREFRAME_quality_audit_'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);
}


/* v19: lightweight navigation shortcuts. Stored only on this device. */
const LF_PIN_KEY='loreframe_nav_pins_v19';
const LF_RECENT_KEY='loreframe_nav_recent_v19';
const LF_DEFAULT_PINS=['characters','events','dossier','timeline'];
function lfReadNav(key,fallback){
 try{const x=JSON.parse(localStorage.getItem(key));return Array.isArray(x)?x.filter(v=>tabs.some(t=>t[0]===v)).slice(0,8):fallback.slice()}catch{return fallback.slice()}
}
function lfSaveNav(key,value){try{localStorage.setItem(key,JSON.stringify(value))}catch{}}
function lfNavLabel(t){return tabs.find(x=>x[0]===t)?.[1]||t}
function lfNavPins(){return lfReadNav(LF_PIN_KEY,LF_DEFAULT_PINS)}
function lfNavRecent(){return lfReadNav(LF_RECENT_KEY,[])}
function lfTogglePin(t){
 const pins=lfNavPins();
 const next=pins.includes(t)?pins.filter(x=>x!==t):[...pins,t].slice(0,8);
 lfSaveNav(LF_PIN_KEY,next);render();
}
function lfTrackRecent(t){
 const next=[t,...lfNavRecent().filter(x=>x!==t)].slice(0,6);
 lfSaveNav(LF_RECENT_KEY,next);
}
function lfNavSearch(v){
 const q=String(v||'').trim().toLowerCase();
 const host=document.getElementById('lf-nav-results');if(!host)return;
 if(!q){host.innerHTML='';return}
 const found=tabs.filter(([id,label])=>label.toLowerCase().includes(q)||id.toLowerCase().includes(q)).slice(0,10);
 host.innerHTML=found.length?found.map(([id,label])=>`<button type="button" onclick="go('${id}')">${esc(label)}</button>`).join(''):'<span class="muted">일치하는 메뉴가 없습니다.</span>';
}
function lfQuickNav(){
 const pins=lfNavPins(),recent=lfNavRecent().filter(t=>!pins.includes(t));
 return `<section class="lf-quick" aria-label="빠른 메뉴"><div class="lf-quick-top"><div><strong>✦ 빠른 이동</strong><small>자주 쓰는 메뉴를 고정해 보세요.</small></div><label class="lf-quick-search"><span class="sr-only">메뉴 검색</span><input type="search" placeholder="🔎 메뉴 검색" aria-label="메뉴 검색" oninput="lfNavSearch(this.value)" autocomplete="off"></label></div>
 <div id="lf-nav-results" class="lf-nav-results" aria-live="polite"></div>
 <div class="lf-quick-links">${pins.map(t=>`<button type="button" onclick="go('${t}')">${esc(lfNavLabel(t))}</button>`).join('')||'<span class="muted">고정한 메뉴가 없습니다.</span>'}</div>
 ${recent.length?`<div class="lf-recent"><span>최근 사용</span>${recent.slice(0,4).map(t=>`<button type="button" onclick="go('${t}')">${esc(lfNavLabel(t))}</button>`).join('')}</div>`:''}
 </section>`;
}
function lfPinControl(){
 if(tab==='home')return '';
 const pinned=lfNavPins().includes(tab);
 return `<div class="lf-pin-row"><span class="muted">현재 메뉴 · ${esc(lfNavLabel(tab))}</span><button type="button" onclick="lfTogglePin('${tab}')" aria-pressed="${pinned}">${pinned?'★ 고정 해제':'☆ 빠른 메뉴에 고정'}</button></div>`;
}
function go(t){tab=t;editId=null;lfTrackRecent(t);render();window.scrollTo({top:0,behavior:'smooth'})}
function render(){

// Roadmap 09 — character profile version history, review and safe restore.
const LF_HISTORY_LIMIT=40;
function lfProfileSnapshot(c){const {history,...profile}=c;return JSON.parse(JSON.stringify(profile))}
function lfTrackProfileChange(old,next,reason){
 if(!old)return next;
 const before=lfProfileSnapshot(old),after=lfProfileSnapshot(next);
 const changed=[...new Set([...Object.keys(before),...Object.keys(after)])].filter(k=>JSON.stringify(before[k]??null)!==JSON.stringify(after[k]??null));
 const history=Array.isArray(old.history)?old.history.slice():[];
 if(changed.length)history.unshift({id:id(),at:new Date().toISOString(),reason:reason||'프로필 직접 수정',fields:changed,before});
 return {...next,history:history.slice(0,LF_HISTORY_LIMIT)};
}
function lfHistoryLabel(k){return ({name:'이름',work:'작품',age:'나이',gender:'성별',traits:'성격 키워드',personality:'성격과 행동',values:'가치관',stress:'스트레스 반응',goal:'목표',fear:'두려움',secret:'비밀',backstory:'과거',mbti:'MBTI',attachment:'애착 유형',role:'서사 역할',spectrum:'심리 스펙트럼'})[k]||k}
function lfHistoryValue(v){if(v===undefined||v===null||v==='')return '(비어 있음)';if(typeof v==='object')return JSON.stringify(v,null,2);return String(v)}
function lfHistoryPanel(c){const entries=Array.isArray(c.history)?c.history:[];
 return `<div class="panel"><div class="section-kicker">CHARACTER / VERSION HISTORY</div><h2>🕘 프로필 변경 이력</h2><p class="muted">프로필을 수정해 저장할 때 이전 버전을 자동 기록합니다. 최근 ${LF_HISTORY_LIMIT}건까지 캐릭터별로 보관하며, 복원 전 현재 버전도 기록합니다.</p>${entries.length?entries.map((h,i)=>`<div class="item"><b>${esc(new Date(h.at).toLocaleString('ko-KR'))}</b> <span class="chip">${esc(h.reason||'수정')}</span><p class="muted">변경 항목: ${(h.fields||[]).map(k=>esc(lfHistoryLabel(k))).join(' · ')||'기록 없음'}</p><div class="actions"><button type="button" onclick="lfShowHistory('${c.id}','${h.id}')">변경 전후 비교</button><button type="button" onclick="lfRestoreHistory('${c.id}','${h.id}')">이 버전으로 복원</button></div><div id="lf-history-${h.id}"></div></div>`).join(''):'<p class="muted">아직 저장된 변경 이력이 없습니다. 프로필을 수정하고 저장하면 기록이 시작됩니다.</p>'}</div>`;
}
function lfShowHistory(cid,hid){const c=char(cid),h=c?.history?.find(x=>x.id===hid);if(!h)return;const box=document.getElementById('lf-history-'+hid);if(!box)return;
 const now=lfProfileSnapshot(c),before=h.before||{};
 const keys=[...new Set([...Object.keys(before),...Object.keys(now)])].filter(k=>JSON.stringify(before[k]??null)!==JSON.stringify(now[k]??null));
 box.innerHTML=`<div class="lf-diff"><p class="muted">선택한 이전 버전과 현재 저장된 프로필을 비교합니다.</p>${keys.length?keys.map(k=>`<div class="lf-diff-item"><b>${esc(lfHistoryLabel(k))}</b><div class="lf-diff-cols"><div><small>이전 버전</small><pre>${esc(lfHistoryValue(before[k]))}</pre></div><div><small>현재 버전</small><pre>${esc(lfHistoryValue(now[k]))}</pre></div></div></div>`).join(''):'<p>현재 프로필과 동일합니다.</p>'}</div>`;
}
function lfRestoreHistory(cid,hid){const c=char(cid),h=c?.history?.find(x=>x.id===hid);if(!h)return;
 if(!confirm('선택한 이전 프로필로 복원할까요? 현재 프로필도 변경 이력에 보관합니다.'))return;
 const restored={...JSON.parse(JSON.stringify(h.before)),id:c.id};
 const next=lfTrackProfileChange(c,restored,'이전 버전 복원');
 db.characters=db.characters.map(x=>x.id===cid?next:x);editId=cid;tab='characters';save();render();alert('프로필을 복원했습니다. 현재 프로필의 이전 상태도 변경 이력에 보관했습니다.');
}

 <div class="lf-dossier-grid"><section class="panel"><div class="section-kicker">01 / CHARACTER PROFILE</div><h2>기본 설정과 내면</h2>${field('성격과 행동',c.personality)}${field('핵심 가치관',c.values)}${field('욕망과 목표',c.goal)}${field('두려움과 약점',c.fear)}${field('스트레스 반응',c.stress)}${field('과거와 배경',c.backstory)}${field('숨기는 감정 · 비밀',c.secret)}${!c.personality&&!c.values&&!c.goal?'<p class="muted">프로필을 편집해 세부 설정을 채워주세요.</p>':''}</section>
 <section class="panel"><div class="section-kicker">02 / PSYCHOLOGY</div><h2>심리 분석</h2><div class="lf-dossier-tags">${[c.mbti&&`MBTI · ${c.mbti}`,c.enneagram&&`에니어그램 · ${c.enneagram}`,c.attachment&&`애착 · ${c.attachment}`].filter(Boolean).map(t=>`<span>${esc(t)}</span>`).join('')||'<span>유형 미설정</span>'}</div><p class="muted">성격 유형은 작가가 입력한 설정이며 AI가 확정 진단한 값이 아닙니다.</p>${spectrum?'<p>저장된 심리 스펙트럼 분석이 있습니다.</p>':'<p>아직 심리 스펙트럼 기록이 없습니다.</p>'}<div class="actions"><button onclick="window.lfPsychSelected='${c.id}';go('psychDetail')">🔬 심리 상세 보기</button><button onclick="go('spectrum')">📊 심리 스펙트럼</button><button onclick="go('motivation')">🔥 욕망·갈등 분석</button></div>${reports.length?`<div class="lf-dossier-field"><small>최근 AI 심층 프로파일</small><p>${esc(String(reports[0].text||'').slice(0,480))}${String(reports[0].text||'').length>480?'…':''}</p><button onclick="go('gallery')">보고서 전체 보기</button></div>`:''}</section>
 <section class="panel"><div class="section-kicker">03 / RELATIONSHIPS</div><h2>연결된 관계 <small>${related.length}</small></h2>${related.length?related.map(r=>{const other=r.a===c.id?r.b:r.a;return `<div class="lf-dossier-listitem"><b>${esc(name(other))}</b><span class="chip">${esc(r.type||'관계 미지정')}</span><p>${esc(r.desc||'관계 설명 없음')}</p><button onclick="openDossier('${other}')">상대 프로필 보기</button></div>`}).join(''):'<p class="muted">아직 연결된 관계가 없습니다.</p>'}<div class="actions"><button onclick="go('graph')">🕸️ 관계도 보기</button><button onclick="go('relations')">관계 편집</button></div></section>
 <section class="panel"><div class="section-kicker">04 / STORY RECORDS</div><h2>서사 기록 <small>${events.length}</small></h2>${events.length?events.slice(0,8).map(e=>{const a=(e.storyAnalysis?.characters||[]).find(x=>x.id===c.id);return `<div class="lf-dossier-listitem"><small>${esc(e.date||'날짜 미지정')} · ${esc(e.category||'사건')}</small><b>${esc(e.title)}</b><p>${esc(String(e.summary||'').slice(0,170))}</p>${a?`<div class="lf-dossier-emotion">✦ ${esc(a.emotion||'감정 미상')} · ${esc(String(a.innerThought||'').slice(0,160))}</div>`:''}<button onclick="go('timeline')">타임라인에서 보기</button></div>`}).join(''):'<p class="muted">아직 이 캐릭터와 연결된 서사가 없습니다.</p>'}<div class="actions"><button onclick="go('events')">📖 서사 아카이브</button><button onclick="go('timeline')">🗓️ 전체 타임라인</button></div></section></div>`;
}

function characters(){let c=char(editId)||{};return `<div class="panel"><h2>${c.id?'캐릭터 수정':'새 캐릭터 등록'}</h2><form id="cf"><div class="grid"><div><label>이름 *</label><input name="name" required value="${esc(c.name)}"></div><div><label>역할 / 작품</label><input name="work" value="${esc(c.work)}" placeholder="작품명 또는 세계관"></div><div><label>캐릭터 일러스트 URL (선택)</label><input name="portraitUrl" type="url" placeholder="https://... (직접 업로드는 추후 지원)" value="${esc(c.portraitUrl)}"></div><div><label>나이</label><input name="age" value="${esc(c.age)}" placeholder="선택 입력"></div>${genderField(c)}<div><label>성격 키워드</label><input name="traits" value="${esc(c.traits)}" placeholder="원칙적, 다정함, 완벽주의"></div></div><div class="grid"><div><label>MBTI (직접 설정)</label><select name="mbti"><option value="">미설정</option>${['INTJ','INTP','ENTJ','ENTP','INFJ','INFP','ENFJ','ENFP','ISTJ','ISFJ','ESTJ','ESFJ','ISTP','ISFP','ESTP','ESFP'].map(v=>`<option ${c.mbti===v?'selected':''}>${v}</option>`).join('')}</select></div><div><label>에니어그램 (직접 설정)</label><select name="enneagram"><option value="">미설정</option>${Array.from({length:9},(_,i)=>`<option ${c.enneagram===String(i+1)?'selected':''}>${i+1}</option>`).join('')}</select></div><div><label>애착 유형 (직접 설정)</label><select name="attachment">${['미설정','안정형','불안형','회피형','혼란형'].map(v=>`<option ${c.attachment===v?'selected':''}>${v}</option>`).join('')}</select></div><div><label>서사 역할</label><input name="role" value="${esc(c.role)}" placeholder="주인공, 조력자, 대립자"></div></div><label>핵심 가치관</label><textarea name="values" placeholder="이 인물이 절대 포기하지 않는 신념은 무엇인가요?">${esc(c.values)}</textarea><label>스트레스 상황에서의 반응</label><textarea name="stress" placeholder="압박, 배신, 상실에 어떻게 반응하나요?">${esc(c.stress)}</textarea><label>성격과 행동</label><textarea name="personality" placeholder="평소 말투, 장점, 단점, 갈등 반응">${esc(c.personality)}</textarea><label>과거와 배경</label><textarea name="backstory">${esc(c.backstory)}</textarea><label>욕망 / 목표</label><textarea name="goal">${esc(c.goal)}</textarea><label>비밀 / 숨기는 감정</label><textarea name="secret" placeholder="겉으로 드러내지 않는 감정, 과거의 비밀">${esc(c.secret)}</textarea><label>두려움 / 약점</label><textarea name="fear">${esc(c.fear)}</textarea>${bigFields(c)}<div class="actions"><button class="primary">저장하기</button>${c.id?'<button type="button" onclick="editId=null;render()">취소</button>':''}</div></form></div>${c.id?lfHistoryPanel(c):''}${c.id?`<div class="panel" id="dialogue-analyzer"><div class="section-kicker">CHARACTER / AI PROFILE EDITOR</div><h2>✨ 대화·역극 기록으로 프로필 자동 보완</h2><p class="muted">이 캐릭터가 등장하는 대화와 행동 묘사를 붙여넣으세요. AI가 기존 설정과 비교해 성격·말투·심리 항목의 수정안을 작성합니다. 검토 후 입력칸에 적용하고, 마지막에 저장하기를 눌러야 저장됩니다.</p><textarea id="dialogue-source" rows="10" placeholder="${esc(c.name)}: ...&#10;상대: ...&#10;[행동 묘사] ..."></textarea><p class="formnote">대화 원문은 자동 저장하지 않습니다. 분석 시 선택한 AI 제공업체에 전송됩니다. 최대 16,000자. 원작 설정과 충돌하는 추측은 반영하지 마세요.</p><div class="actions"><button type="button" class="primary" id="dialogue-run" onclick="analyzeDialogue()">✨ 기존 항목 자동 보완안 생성</button><button type="button" onclick="document.getElementById('dialogue-source').value='';document.getElementById('dialogue-result').innerHTML='';dialogueDraft=null">입력 지우기</button></div><div id="dialogue-result" role="status" aria-live="polite"></div></div>`:''}<div class="panel"><h2>등록된 캐릭터 (${db.characters.length})</h2>${db.characters.map(x=>`<div class="item"><b>${esc(x.name)}</b> <span class="chip">${esc(x.work||'작품 미지정')}</span><p>${esc(x.traits||x.personality||'설명 없음')}</p><div class="actions"><button onclick="openDossier('${x.id}')">상세 보기</button><button onclick="editId='${x.id}';render()">수정</button><button onclick="tab='analysis';render();$('#target').value='${x.id}';showAnalysis()">분석</button><button class="danger" onclick="removeChar('${x.id}')">삭제</button></div></div>`).join('')||empty('첫 캐릭터를 등록해 보세요.')}</div>`}
function removeChar(cid){if(!confirm('캐릭터를 삭제할까요? 연결된 관계도 함께 삭제됩니다.'))return;db.characters=db.characters.filter(x=>x.id!==cid);db.relations=db.relations.filter(x=>x.a!==cid&&x.b!==cid);save();render()}
function analysis(){return `<div class="panel"><h2>🧠 캐릭터 성격 분석</h2><p class="muted">입력된 설정을 바탕으로 성격의 동기와 갈등을 정리하는 창작 보조 분석입니다. MBTI·에니어그램·Big 5의 정확한 판정에는 별도 질문지나 AI 연동이 필요합니다.</p>${db.characters.length?`<label>분석 대상</label><select id="target">${opt()}</select><div class="actions"><button class="primary" onclick="showAnalysis()">기본 분석 보기</button><button type="button" onclick="runIntegratedAI('character')">✨ AI 성격 심층 분석</button></div><div id="result"></div><div id="integrated-character-result"></div>`:empty('캐릭터를 먼저 등록해 주세요.')}</div>`}
function showAnalysis(){const x=char($('#target').value);if(!x)return;const p=[x.traits,x.personality,x.backstory].filter(Boolean).join(' ');const strengths=x.traits||'설정된 성격 키워드가 없습니다';const motive=x.goal||'목표를 입력하면 핵심 동기를 분석할 수 있습니다';const fear=x.fear||'약점을 입력하면 갈등 요소를 정리할 수 있습니다';$('#result').innerHTML=`<div class="item"><h3>${esc(x.name)}의 캐릭터 해석</h3><span class="chip">핵심 성향</span><p>${esc(strengths)}</p><span class="chip">행동의 동기</span><p>${esc(motive)}</p><span class="chip">내적 갈등</span><p>${esc(fear)}</p><span class="chip">성장 서사 제안</span><p>${esc(x.name)}이(가) '${esc(motive)}'을(를) 추구하는 과정에서 '${esc(fear)}'과(와) 마주하는 사건을 배치해 보세요. 선택의 대가를 드러내면 성격 변화가 설득력 있어집니다.</p><span class="chip">성격 이론 참고</span><p>MBTI·에니어그램·Big 5는 이 입력만으로 신뢰성 있게 확정할 수 없습니다. 인물의 구체적 선택과 반응을 더 기록해 보세요.</p></div>`}
function relations(){let r=db.relations.find(x=>x.id===editId)||{};return `<div class="panel"><h2>${r.id?'관계 수정':'새 관계 만들기'}</h2>${db.characters.length<2?empty('관계를 만들려면 캐릭터 2명 이상이 필요합니다.'):`<form id="rf"><div class="grid"><div><label>캐릭터 A</label><select name="a">${opt(r.a)}</select></div><div><label>캐릭터 B</label><select name="b">${opt(r.b||db.characters[1]?.id)}</select></div><div><label>관계 유형</label><select name="type">${['연인','친구','라이벌','가족','동료','짝사랑','적대','기타'].map(v=>`<option ${r.type===v?'selected':''}>${v}</option>`).join('')}</select></div><div><label>관계 상태</label><input name="status" value="${esc(r.status)}" placeholder="서먹함, 신뢰 형성 중"></div></div><label>관계 설명</label><textarea name="desc" placeholder="서로에게 느끼는 감정, 공통점, 차이점">${esc(r.desc)}</textarea><label>관계의 전환점</label><textarea name="turning" placeholder="두 사람의 관계를 뒤바꾼 사건">${esc(r.turning)}</textarea><label>관계의 강점</label><textarea name="strength" placeholder="서로를 지탱해주는 부분">${esc(r.strength)}</textarea><label>갈등 요소</label><textarea name="conflict">${esc(r.conflict)}</textarea><div class="actions"><button class="primary">관계 저장</button></div></form>`}</div><div class="panel"><h2>관계 목록</h2>${db.relations.map(x=>`<div class="item"><b>${esc(name(x.a))} × ${esc(name(x.b))}</b><span class="chip">${esc(x.type)}</span><p>${esc(x.desc||'관계 설명 없음')}</p><div class="actions"><button onclick="showRelation('${x.id}')">관계 해석</button><button onclick="editId='${x.id}';render()">수정</button><button class="danger" onclick="removeRelation('${x.id}')">삭제</button></div><div id="rel-${x.id}"></div></div>`).join('')||empty('등록된 관계가 없습니다.')}</div>`}
function showRelation(rid){const r=db.relations.find(x=>x.id===rid),a=char(r.a),b=char(r.b);if(!a||!b)return;$('#rel-'+rid).innerHTML=`<div class="item"><h3>💞 관계 해석</h3><div class="actions"><button type="button" onclick="runIntegratedAI('relation','${rid}')">✨ AI 관계 심층 분석</button></div><p><b>관계의 중심:</b> ${esc(r.status||r.type)}</p><p><b>${esc(a.name)}의 목표:</b> ${esc(a.goal||'미설정')}</p><p><b>${esc(b.name)}의 목표:</b> ${esc(b.goal||'미설정')}</p><p><b>갈등 가능성:</b> ${esc(r.conflict||'서로의 목표가 충돌하는 순간을 구체적으로 설정해 보세요.')}</p><p><b>서사 제안:</b> 두 인물이 같은 사건을 서로 다른 가치관으로 해석하는 장면을 기록하면 관계 변화가 선명해집니다.</p><p class="muted">궁합 점수는 근거 없는 숫자 대신 서사적 분석으로 제공합니다.</p></div>`}
function removeRelation(rid){if(confirm('관계를 삭제할까요?')){db.relations=db.relations.filter(x=>x.id!==rid);save();render()}}
function graph(){let cs=db.characters;let W=680,H=Math.max(330,cs.length*35+160),cx=W/2,cy=H/2,R=Math.min(235,H/2-60),pos=Object.fromEntries(cs.map((x,i)=>[x.id,{x:cx+R*Math.cos(2*Math.PI*i/cs.length-Math.PI/2),y:cy+R*Math.sin(2*Math.PI*i/cs.length-Math.PI/2)}]));return `<div class="panel"><h2>🕸️ 캐릭터 관계도</h2><div class="actions"><button type="button" onclick="runIntegratedAI('graph')">✨ AI 관계망 분석</button></div><div id="integrated-graph-result"></div><div class="lf-ai-rel-panel"><h3>✨ AI 관계도 자동 구성</h3><p class="muted">등록된 인물의 프로필·관계·사건을 분석해 관계 후보를 제안합니다. 제안은 확인 전까지 관계도에 저장되지 않습니다.</p><div class="actions"><button type="button" class="primary" id="lf-rel-run" onclick="aiBuildRelations()" ${cs.length<2?'disabled':''}>AI 관계 후보 찾기</button></div><p id="lf-rel-status" class="lf-setup-note" role="status">캐릭터 2명 이상과 AI 연결 설정이 필요합니다.</p><div id="lf-rel-proposals"></div></div><p class="muted">캐릭터가 노드로, 등록된 관계가 선으로 표시됩니다.</p>${cs.length?`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="캐릭터 관계도">${db.relations.filter(r=>pos[r.a]&&pos[r.b]).map(r=>`<line x1="${pos[r.a].x}" y1="${pos[r.a].y}" x2="${pos[r.b].x}" y2="${pos[r.b].y}" stroke="#a79be7" stroke-width="3"/><text x="${(pos[r.a].x+pos[r.b].x)/2}" y="${(pos[r.a].y+pos[r.b].y)/2-7}" text-anchor="middle" font-size="12" fill="#6357a7">${esc(r.type)}</text>`).join('')}${cs.map(c=>`<circle cx="${pos[c.id].x}" cy="${pos[c.id].y}" r="39" fill="#6256be"/><text x="${pos[c.id].x}" y="${pos[c.id].y+5}" text-anchor="middle" font-size="13" font-weight="bold" fill="white">${esc(c.name.slice(0,7))}</text>`).join('')}</svg>`:empty('캐릭터를 등록하면 관계도가 나타납니다.')}</div>`}

/* Roadmap 02: AI relationship proposals; user-approved changes only. */
let lfRelDraft=[];
const lfRelTypes=['연인','친구','라이벌','가족','동료','짝사랑','적대','기타'];
function lfRelKey(a,b){return [String(a),String(b)].sort().join('::')}
function lfRelPresent(a,b){return db.relations.some(r=>lfRelKey(r.a,r.b)===lfRelKey(a,b))}
function lfRelRenderDraft(){

let pendingBackup=null,backupBusy=false;
const LF_BACKUP_LIMIT=15*1024*1024;
const LF_BACKUP_ARRAYS=['characters','relations','events'];
function lfBackupCounts(d){return {worlds:Array.isArray(d.projectSpaces)?d.projectSpaces.length:1,characters:d.characters?.length||0,relations:d.relations?.length||0,events:d.events?.length||0}}
function lfBackupValidate(x){
 if(!x||typeof x!=='object'||Array.isArray(x))throw Error('백업 데이터는 JSON 객체여야 합니다.');
 for(const k of LF_BACKUP_ARRAYS)if(!Array.isArray(x[k]))throw Error(k+' 목록이 없는 백업 파일입니다.');
 for(const k of LF_BACKUP_ARRAYS)if(x[k].some(v=>!v||typeof v!=='object'||Array.isArray(v)))throw Error(k+'에 올바르지 않은 항목이 있습니다.');
 if(x.projectSpaces!==undefined){
  if(!Array.isArray(x.projectSpaces)||!x.projectSpaces.length)throw Error('세계관 목록이 비어 있거나 잘못되었습니다.');
  const ids=new Set();
  for(const p of x.projectSpaces){
   if(!p||typeof p!=='object'||typeof p.id!=='string'||!p.id||ids.has(p.id)||!p.data||typeof p.data!=='object')throw Error('세계관 구조 또는 ID가 잘못되었습니다.');
   ids.add(p.id);
   for(const key of LF_BACKUP_ARRAYS)if(!Array.isArray(p.data[key]))throw Error('세계관 '+(p.name||p.id)+'의 '+key+' 목록이 누락되었습니다.');
   for(const key of PROJECT_KEYS)if(p.data[key]!==undefined&&!Array.isArray(p.data[key]))throw Error('세계관 '+(p.name||p.id)+'의 '+key+' 데이터가 올바르지 않습니다.');
  }
  if(!ids.has(x.activeProjectId))throw Error('활성 세계관 ID가 백업에 존재하지 않습니다.');
 }
 for(const key of PROJECT_KEYS)if(x[key]!==undefined&&!Array.isArray(x[key]))throw Error(key+' 데이터 형식이 잘못되었습니다.');
 return x;
}

async function upload(ev){
 const selected=ev.target.files?.[0];lfCancelRestore();
 try{
  const file=selected;if(!file)return;
  if(file.size>LF_BACKUP_LIMIT)throw Error('파일 크기가 15MB를 초과합니다.');
  const text=await file.text();
  const data=lfBackupValidate(JSON.parse(text));
  pendingBackup={data,filename:file.name};
  document.getElementById('backup-preview').innerHTML=lfBackupPreviewHTML();
 }catch(e){alert('백업 검토 실패: '+e.message)}
}
async function lfCommitRestore(){
 if(backupBusy||!pendingBackup)return;
 if(document.getElementById('lf-backup-confirm')?.value.trim()!=='복원합니다')return alert('확인 문구를 정확하게 입력해 주세요.');
 if(!currentUser)return alert('복원하려면 로그인해야 합니다.');
 if(!confirm('현재 계정의 모든 세계관 데이터를 교체합니다. 계속할까요?'))return;
 backupBusy=true;
 const before=structuredClone(db),next=structuredClone(pendingBackup.data);
 try{
  lfBackupValidate(next);
  clearTimeout(syncTimer);syncTimer=null;
  // The server is updated first; local data is replaced only after success.
  await api('/api/data',{method:'PUT',body:JSON.stringify(next)});
  db=next;initializeProjects();
  const active=activeWorld();
  if(active?.data)for(const key of PROJECT_KEYS)db[key]=structuredClone(active.data[key]||[]);
  pendingBackup=null;editId=null;tab='home';render();setSync('복원 완료 · 클라우드 저장됨');
  alert('복원이 완료되었습니다. 현재 계정에 백업 데이터를 적용했습니다.');
 }catch(e){
  db=before;
  alert('복원 실패: '+e.message+'. 기존 화면 데이터는 유지했습니다. 서버 연결 상태를 확인해 주세요.');
 }finally{backupBusy=false}
}

const AXES=[['trust','신뢰','서로의 말과 행동을 얼마나 믿는가'],['closeness','친밀감','감정을 얼마나 깊이 공유하는가'],['tension','긴장감','서로에게 느끼는 압박과 불안'],['dependence','상호 의존','서로에게 얼마나 기대는가'],['communication','소통','속마음과 갈등을 표현하는 정도'],['balance','힘의 균형','관계에서 주도권이 균등한 정도']];
function couples(){if(!db.relations.length)return `<div class="panel"><h2>💗 커플 다이내믹 리포트</h2><p class="muted">관계 분석에서 먼저 두 캐릭터를 연결해 주세요. 연인 외의 관계도 분석할 수 있습니다.</p><button class="primary" onclick="go('relations')">관계 만들기</button></div>`;return `<div class="panel no-print"><div class="section-kicker">RELATIONSHIP LAB / STUDIO 5.0</div><h2>💗 커플 다이내믹 리포트</h2><p class="muted">관계의 심리적 거리와 변화 단계를 직접 설계하고, 결과를 한 장의 리포트로 정리하세요. 점수는 창작자가 설정한 연출 지표이며 AI 판정이 아닙니다.</p><label>분석할 관계</label><select id="couple-select" onchange="renderCouple()">${db.relations.map(r=>`<option value="${r.id}">${esc(name(r.a))} × ${esc(name(r.b))} · ${esc(r.type)}</option>`).join('')}</select></div><div id="couple-report"></div>`}

ton></div></form></div><div class="panel"><div class="section-kicker">04 / CREATIVE INSIGHTS</div><h2>관계 구조 미리보기</h2>${AXES.map(([k,label])=>`<div><div style="display:flex;justify-content:space-between"><b>${label}</b><span>${vals[k]} / 100</span></div><div class="axisbar"><i style="width:${vals[k]}%"></i></div></div>`).join('')}<div class="report-questions"><div><b>친밀감과 신뢰</b><p>${vals.closeness>vals.trust?'감정적 거리는 가깝지만 확신이 부족한 설정입니다. 친밀한 순간에 의심이 끼어드는 장면을 실험해 보세요.':'서로를 믿는 정도와 가까움의 균형을 살펴보세요. 신뢰가 행동으로 드러나는 사건을 설계해 보세요.'}</p></div><div><b>긴장과 소통</b><p>${vals.tension>65&&vals.communication<45?'긴장감은 높고 소통은 적은 설정입니다. 말하지 않은 진심이 갈등을 키우는 장면에 적합합니다.':'두 인물이 같은 갈등을 어떻게 말하고 회피하는지 대비해 보세요.'}</p></div><div><b>의존과 주도권</b><p>${vals.dependence>65&&vals.balance<40?'의존도가 높고 주도권이 불균형한 설정입니다. 누가 먼저 독립적인 선택을 하는지가 전환점이 될 수 있습니다.':'서로에게 기대는 방식과 선택권을 누가 갖는지 구체적인 사건으로 표현해 보세요.'}</p></div><div><b>성장 가능성</b><p>두 사람이 처음과 같은 문제를 다시 만났을 때 어떤 선택을 달리할까요? 그 차이가 관계의 성장선이 됩니다.</p></div></div><p class="reportnote">위 해석은 창작자가 지정한 수치를 조건에 따라 정리한 것으로, 실제 심리 검사나 AI 분석이 아닙니다.</p></div>`}

function bigFields(c){return `<div class="vizcard"><h3>✦ Big 5 창작자 직접 평가</h3><p class="reportnote">캐릭터 설정에 맞게 0~100으로 직접 지정하세요. 심리검사나 AI 추정치가 아닙니다. 정서 민감성은 높을수록 감정 반응이 큰 설정입니다.</p><div class="vizgrid">${BIG.map(([k,label])=>`<div class="rangeitem"><label>${label} <output id="out-${k}">${esc(c['big_'+k]??50)}</output></label><input type="range" min="0" max="100" name="big_${k}" value="${esc(c['big_'+k]??50)}" oninput="document.getElementById('out-${k}').textContent=this.value"></div>`).join('')}</div></div>`}
function radar(x){let vals=BIG.map(([k])=>x['big_'+k]==null?null:Number(x['big_'+k]));if(vals.every(v=>v===null))return '<p class="reportnote">캐릭터 수정에서 Big 5 값을 직접 지정하면 차트가 나타납니다.</p>';vals=vals.map(v=>v??50);let cx=180,cy=165,r=105;const pt=(i,v)=>{let a=-Math.PI/2+i*2*Math.PI/5;return [cx+Math.cos(a)*r*v/100,cy+Math.sin(a)*r*v/100]};const poly=v=>v.map((n,i)=>pt(i,n).join(',')).join(' ');return `<div class="vizcard"><h3>Big 5 성향 레이더</h3><svg viewBox="0 0 360 335" aria-label="직접 입력한 Big 5 성향 레이더 차트">${[20,40,60,80,100].map(n=>`<polygon points="${poly(Array(5).fill(n))}" fill="none" stroke="#e7e2f5"/>`).join('')}${BIG.map((_,i)=>`<line x1="${cx}" y1="${cy}" x2="${pt(i,100)[0]}" y2="${pt(i,100)[1]}" stroke="#ded7f2"/>`).join('')}<polygon points="${poly(vals)}" fill="#a18cf4" fill-opacity=".35" stroke="#6652d2" stroke-width="3"/>${BIG.map(([k,label],i)=>{let [a,b]=pt(i,128);return `<text x="${a}" y="${b}" font-size="12" text-anchor="middle" fill="#554a83">${label}</text>`}).join('')}</svg><div class="legend">${BIG.map(([k,label],i)=>`<span>${label} ${vals[i]}</span>`).join('')}</div><p class="reportnote">창작자 직접 입력 · 진단/자동 판정 아님</p></div>`}
function compareBig(a,b){if(!BIG.some(([k])=>a['big_'+k]!=null&&b['big_'+k]!=null))return '<p class="reportnote">두 캐릭터의 Big 5를 입력하면 성향 비교가 표시됩니다.</p>';return `<div class="vizcard"><h3>두 인물의 성향 비교</h3><div class="legend"><span><i style="background:#6652d2"></i>${esc(a.name)}</span><span><i style="background:#ef83af"></i>${esc(b.name)}</span></div>${BIG.map(([k,label])=>`<div class="rangeitem"><b>${label}</b><div class="meter"><i style="width:${Number(a['big_'+k]??50)}%"></i></div><div class="meter"><i style="width:${Number(b['big_'+k]??50)}%;background:linear-gradient(90deg,#f5b1ce,#ef83af)"></i></div></div>`).join('')}<p class="reportnote">점수는 직접 입력한 창작 설정의 비교이며 궁합 판정이 아닙니다.</p></div>`}
function emotionChart(){let es=db.events.filter(x=>x.intensity!==undefined&&x.intensity!=='').slice().sort((a,b)=>a.date.localeCompare(b.date));if(!es.length)return '<div class="empty">서사 사건을 수정해 감정 강도(0~100)를 기록하면 그래프가 나타납니다.</div>';let w=680,h=265,px=45,py=25,iw=590,ih=185;let points=es.map((x,i)=>[px+(es.length===1?iw/2:i*iw/(es.length-1)),py+ih-(Number(x.intensity)/100)*ih]);return `<div class="vizcard"><h3>감정 강도 흐름</h3><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="서사 사건별 감정 강도 선 그래프">${[0,25,50,75,100].map(v=>`<line x1="${px}" y1="${py+ih-v/100*ih}" x2="${px+iw}" y2="${py+ih-v/100*ih}" stroke="#e9e4f4"/><text x="${px-8}" y="${py+ih-v/100*ih+4}" text-anchor="end" font-size="12" fill="#777">${v}</text>`).join('')}<polyline fill="none" stroke="#7560df" stroke-width="3" stroke-linejoin="round" points="${points.map(p=>p.join(',')).join(' ')}"/>${points.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="#7560df"><title>${esc(es[i].title)}: ${esc(es[i].intensity)}</title></circle><text x="${p[0]}" y="${h-20}" text-anchor="middle" font-size="11" fill="#70688b">${esc(es[i].title.slice(0,7))}</text>`).join('')}</svg><p class="reportnote">각 사건의 감정 강도를 작가가 직접 지정한 기록입니다. 사건은 날짜순으로 연결됩니다.</p></div>`}

s="ai-tabs"><button class="${aiMode==='create'?'selected':''}" onclick="aiMode='create';render()">✧ 신규 캐릭터 생성</button><button class="${aiMode==='analyze'?'selected':''}" onclick="aiMode='analyze';render()">◈ 캐릭터 심층 분석</button><button class="${aiMode==='bond'?'selected':''}" onclick="aiMode='bond';render()">♡ 관계 심층 분석</button></div>${aiMode==='create'?`<label>세계관 / 작품</label><input id="ai-world" placeholder="예: 근미래 해양 도시, 판타지 왕국"><label>인물 콘셉트 / 키워드 *</label><textarea id="ai-concept" placeholder="예: 냉철한 의무관. 과거에 누군가를 구하지 못한 죄책감이 있고..." rows="5"></textarea><div class="grid"><div><label>역할</label><input id="ai-role" placeholder="주인공, 라이벌, 조력자"></div><div><label>분위기</label><select id="ai-tone"><option>입체적이고 현실적인</option><option>로맨틱하고 섬세한</option><option>어둡고 비극적인</option><option>유쾌하고 독특한</option><option>서늘하고 미스터리한</option></select></div></div>`:aiMode==='analyze'?`<label>분석할 캐릭터</label>${db.characters.length?`<select id="ai-target">${opt()}</select>`:'<p class="muted">먼저 캐릭터를 등록해 주세요.</p>'}<label>집중 분석할 질문 (선택)</label><textarea id="ai-question" placeholder="예: 이 인물이 사랑을 거부하는 이유와 변화의 계기"></textarea>`:`<label>분석할 관계</label>${db.relations.length?`<select id="ai-relation">${db.relations.map(r=>`<option value="${r.id}">${esc(name(r.a))} × ${esc(name(r.b))} · ${esc(r.type)}</option>`).join('')}</select>`:'<p class="muted">관계 분석 메뉴에서 두 캐릭터를 연결해 주세요.</p>'}<label>집중 분석할 질문 (선택)</label><textarea id="ai-question" placeholder="예: 권력 역전의 계기와 갈등 해결 가능성"></textarea>`}<div class="ai-actions" style="margin-top:16px"><button class="primary" id="ai-generate" onclick="aiGenerate()">✦ ${aiMode==='create'?'캐릭터 생성하기':aiMode==='analyze'?'심층 분석 생성':'관계 리포트 생성'}</button><button onclick="aiCancel()">요청 취소</button></div><p class="ai-note">분석은 창작을 위한 해석이며 임상적 진단이 아닙니다. 생성된 MBTI·애착 유형 등은 가설로 취급하세요.</p></div><div class="panel"><h2>03 / 생성 결과</h2><div id="ai-output">${aiResult?aiResultHtml():'<p class="muted">생성 결과가 여기에 표시됩니다. 결과를 확인하고 수정한 뒤 저장할 수 있어요.</p>'}</div></div>`}

/* v20: parse a single JSON object, including fenced output and prose around a balanced object. */
function aiSafeJson(source){
 if(typeof source!=='string'||!source.trim())throw Error('AI 응답이 비어 있습니다. 다시 분석해 주세요.');
 const text=source.trim().replace(/^\uFEFF/,'');
 const fenced=text.match(/^```(?:json)?\s*([\s\S]*?)\s*```$/i);
 const content=fenced?fenced[1].trim():text;
 try{const obj=JSON.parse(content);if(!obj||typeof obj!=='object'||Array.isArray(obj))throw Error('AI 응답은 JSON 객체여야 합니다.');return obj}catch(err){if(err.message==='AI 응답은 JSON 객체여야 합니다.')throw err}
 // Extract the first balanced JSON object while respecting quoted braces.
 let start=-1,depth=0,inString=false,escaped=false;
 for(let i=0;i<content.length;i++){
  const ch=content[i];

function wrapReportLines(ctx,raw,maxWidth){
 const out=[];
 for(const paragraph of String(raw||'').replace(/\r/g,'').split('\n')){
  if(!paragraph){out.push('');continue}
  let line='';
  for(const ch of paragraph){if(ctx.measureText(line+ch).width>maxWidth&&line){out.push(line);line=ch}else line+=ch}
  if(line)out.push(line);
 }
 return out;
}

  let yy=315;
  for(const line of pages[page]){
   if(line.kind==='gap'){yy+=24;continue}
   if(line.kind==='heading'){ctx.fillStyle=t.accent;ctx.font='bold 27px "Noto Sans KR",sans-serif';yy+=48}
   else{ctx.fillStyle=t.ink;ctx.font='28px "Noto Sans KR",sans-serif';yy+=43}
   if(line.text)ctx.fillText(line.text,x,yy);
  }
  ctx.fillStyle=t.muted;ctx.font='21px sans-serif';
  ctx.fillText(`LOREFRAME · ${page+1} / ${pages.length}`,x,1350);
  const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));
  if(!blob)return alert('PNG 생성에 실패했습니다.');
  saveBlob(blob,shareFilename(d,'png').replace(/\.png$/,`_${String(page+1).padStart(2,'0')}.png`));
 }
}

// Roadmap 01 — fictional character psychology spectrum.
const spectrumAxes=[['expression','감정 표현','감정을 외부로 드러내는 정도'],['impulse','충동성','즉각적으로 행동하는 경향'],['empathy','공감 표현','상대의 감정을 이해하고 표현하는 경향'],['control','통제 욕구','상황과 선택을 통제하려는 경향'],['trust','신뢰 개방성','타인을 믿고 마음을 여는 경향'],['resilience','회복 탄력성','좌절 이후 다시 행동하는 경향']];
let spectrumDraft=null;
function spectrum(){const selected=char(window.spectrumSelected)||db.characters[0];if(!selected)return '<div class="panel"><h2>📊 캐릭터 심리 스펙트럼</h2><p class="muted">캐릭터를 먼저 등록해 주세요.</p></div>';
 window.spectrumSelected=selected.id;
 return `<div class="panel"><div class="section-kicker">CHARACTER / PSYCHOLOGY SPECTRUM</div><h2>📊 캐릭터 심리 스펙트럼</h2><p class="muted">프로필·관계·사건 기록을 바탕으로 AI가 여섯 가지 서사적 성향을 해석합니다. 수치는 창작용 상대 지표이며 심리 검사나 객관적 진단이 아닙니다.</p><label>캐릭터 선택</label><select id="sp-target" onchange="spectrumChoose(this.value)">${opt(selected.id)}</select><div class="actions"><button type="button" class="primary" id="sp-analyze" onclick="spectrumAnalyze()">✨ AI로 심리 스펙트럼 분석</button><button type="button" onclick="go('characters');editId='${selected.id}';render()">캐릭터 수정</button></div><p class="formnote">AI 연결 설정에서 API 키 저장과 연결 테스트를 먼저 완료하세요. 분석 결과는 검토 후 저장해야 캐릭터에 반영됩니다.</p><div id="sp-status" role="status" aria-live="polite"></div></div><div id="sp-content">${spectrumDraft?.characterId===selected.id?spectrumCard(spectrumDraft,true):selected.spectrum?spectrumCard({characterId:selected.id,...selected.spectrum},false):'<div class="panel"><p class="muted">아직 저장된 분석이 없습니다. AI 분석을 실행해 주세요.</p></div>'}</div>`;
}
function spectrumChoose(cid){window.spectrumSelected=cid;spectrumDraft=null;render()}
function spectrumNormalize(raw,characterId){const axes={};for(const [key] of spectrumAxes){const src=raw.axes?.[key]||{};const val=Number(src.score);axes[key]={score:Number.isFinite(val)?Math.max(0,Math.min(100,Math.round(val))):50,evidence:String(src.evidence||'근거 부족'),confidence:['높음','보통','낮음'].includes(src.confidence)?src.confidence:'낮음'}}return {characterId,axes,summary:String(raw.summary||''),limitations:String(raw.limitations||''),createdAt:new Date().toISOString()}}
function spectrumRadar(axes){const cx=180,cy=174,R=116,n=spectrumAxes.length,pt=(i,r)=>{const a=-Math.PI/2+2*Math.PI*i/n;return [(cx+Math.cos(a)*r).toFixed(1),(cy+Math.sin(a)*r).toFixed(1)].join(',')};const rings=[25,50,75,100].map(v=>`<polygon points="${spectrumAxes.map((_,i)=>pt(i,R*v/100)).join(' ')}" fill="none" stroke="#e4def3" stroke-width="1"/>`).join('');const spokes=spectrumAxes.map((_,i)=>`<line x1="${cx}" y1="${cy}" x2="${pt(i,R).split(',')[0]}" y2="${pt(i,R).split(',')[1]}" stroke="#e4def3"/>`).join('');const polygon=spectrumAxes.map(([k],i)=>pt(i,R*axes[k].score/100)).join(' ');const labels=spectrumAxes.map(([k,label],i)=>{let [x,y]=pt(i,R+36).split(',');return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#51476e">${label}</text>`}).join('');return `<svg class="sp-radar" viewBox="0 0 360 350" role="img" aria-label="여섯 심리 성향 레이더 차트">${rings}${spokes}<polygon points="${polygon}" fill="#9074d4" fill-opacity=".25" stroke="#7055bb" stroke-width="2.5"/>${spectrumAxes.map(([k],i)=>{let [x,y]=pt(i,R*axes[k].score/100).split(',');return `<circle cx="${x}" cy="${y}" r="4" fill="#6a50af"/>`}).join('')}${labels}</svg>`}
function spectrumCard(result,draft){const axes=result.axes;return `<div class="panel"><div class="section-kicker">${draft?'AI PROPOSAL / REVIEW':'SAVED / CHARACTER RECORD'}</div><h2>${draft?'AI 분석 제안 · 저장 전 검토':'저장된 심리 스펙트럼'}</h2><div class="sp-layout"><div><div id="sp-chart">${spectrumRadar(axes)}</div><p class="sp-warning">수치는 프로필에 대한 AI의 해석입니다. 높은 점수가 더 좋은 성격을 의미하지 않으며, 기록이 적으면 추정의 불확실성이 커집니다.</p></div><div>${spectrumAxes.map(([key,label,hint])=>`<div class="sp-metric"><div class="sp-metric-head"><b>${label}</b><output id="sp-value-${key}">${axes[key].score}</output></div>${draft?`<input type="range" min="0" max="100" step="1" value="${axes[key].score}" aria-label="${label} 수정" oninput="spectrumAdjust('${key}',this.value)">`:`<div class="axisbar"><i style="width:${axes[key].score}%"></i></div>`}<div class="micro">${hint} · 근거 신뢰도: ${esc(axes[key].confidence)}</div><div class="sp-evidence">${esc(axes[key].evidence)}</div></div>`).join('')}</div></div><h3>종합 해석</h3><p style="white-space:pre-wrap">${esc(result.summary)}</p><h3>해석의 한계</h3><p class="muted" style="white-space:pre-wrap">${esc(result.limitations||'기록된 장면과 상황에 따라 다르게 나타날 수 있습니다.')}</p>${draft?'<div class="actions"><button type="button" class="primary" onclick="spectrumSave()">✓ 검토한 수치 저장</button><button type="button" onclick="spectrumDraft=null;render()">제안 취소</button></div>':'<p class="micro">분석 저장 시각: '+esc(new Date(result.createdAt).toLocaleString('ko-KR'))+'</p>'}</div>`}
function spectrumAdjust(key,val){if(!spectrumDraft)return;spectrumDraft.axes[key].score=Number(val);const output=document.getElementById('sp-value-'+key);if(output)output.textContent=val;const chart=document.getElementById('sp-chart');if(chart)chart.innerHTML=spectrumRadar(spectrumDraft.axes)}
function spectrumSave(){if(!spectrumDraft)return;const c=char(spectrumDraft.characterId);if(!c)return alert('캐릭터를 찾을 수 없습니다.');const {characterId,...record}=spectrumDraft;const revised=lfTrackProfileChange(c,{...c,spectrum:JSON.parse(JSON.stringify(record))},'심리 스펙트럼 저장');db.characters=db.characters.map(x=>x.id===c.id?revised:x);save();spectrumDraft=null;render();const st=document.getElementById('sp-status');if(st)st.textContent='✓ 캐릭터의 심리 스펙트럼에 저장했습니다. 서버 저장 상태도 확인해 주세요.'}
async function spectrumAnalyze(){const c=char(document.getElementById('sp-target')?.value);if(!c)return;const btn=document.getElementById('sp-analyze'),status=document.getElementById('sp-status');btn.disabled=true;status.textContent='✨ 기존 프로필과 관련 서사를 분석 중입니다…';try{const relations=db.relations.filter(r=>r.a===c.id||r.b===c.id).map(r=>({type:r.type,status:r.status,desc:r.desc,otherName:name(r.a===c.id?r.b:r.a)}));const events=db.events.filter(e=>e.character===c.id);const fields=['name','work','age','gender','traits','personality','values','stress','goal','fear','secret','backstory','role'];const profile=Object.fromEntries(fields.map(k=>[k,c[k]||'']));const system='당신은 허구 인물의 서사적 심리를 분석하는 편집자입니다. 제공된 기록에 있는 말과 행동만 근거로 해석하고 근거 없는 수치에 높은 확신을 주지 마세요. 인물의 심리 진단, MBTI 판정, 실제 사람의 임상 진단은 하지 마세요. 반드시 JSON 객체만 반환하세요. 형식: {"summary":"한국어 종합 해석","limitations":"근거 부족 및 대안 해석","axes":{"expression":{"score":50,"evidence":"프로필이나 사건의 구체적 근거 또는 근거 부족","confidence":"낮음"},"impulse":{"score":50,"evidence":"...","confidence":"낮음"},"empathy":{"score":50,"evidence":"...","confidence":"낮음"},"control":{"score":50,"evidence":"...","confidence":"낮음"},"trust":{"score":50,"evidence":"...","confidence":"낮음"},"resilience":{"score":50,"evidence":"...","confidence":"낮음"}}}. 각 점수는 0~100, confidence는 높음/보통/낮음 중 하나입니다. 자료가 부족한 축은 50과 낮음으로 두세요. 임의로 사건을 만들지 마세요.';const reply=await aiRequest([{role:'system',content:system},{role:'user',content:JSON.stringify({profile,relations,events:events.slice(0,35)})}]);const parsed=aiSafeJson(reply);if(!parsed.axes||typeof parsed.axes!=='object')throw Error('AI 응답에 심리 지표가 없습니다. 다시 시도해 주세요.');spectrumDraft=spectrumNormalize(parsed,c.id);status.textContent='✓ 분석이 완료됐습니다. 아래 근거와 수치를 검토한 뒤 저장하세요.';document.getElementById('sp-content').innerHTML=spectrumCard(spectrumDraft,true)}catch(e){status.textContent='분석 실패: '+e.message}finally{btn.disabled=false}}


// Roadmap 03 — event-by-event character emotion arcs. Scores are creative estimates, not diagnoses.
let emotionDraft=null;
const eaClamp=v=>Math.max(-100,Math.min(100,Math.round(Number(v)||0)));
function eaEvents(cid){return db.events.filter(e=>!e.character||e.character===cid).slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.id||'').localeCompare(b.id||''));}
function eaSelection(cid){window.eaCharacter=cid;emotionDraft=null;render()}
function eaEscape(v){return esc(v??'')}
function emotionArcPanel(){const c=char(window.eaCharacter)||db.characters[0];if(!c)return `<div class="panel"><h2>💗 캐릭터 감정 변화 타임라인</h2><p class="muted">캐릭터를 등록하면 감정 변화 추적을 시작할 수 있습니다.</p></div>`;
 window.eaCharacter=c.id;const es=eaEvents(c.id);const saved=es.filter(e=>e.emotionArcs&&e.emotionArcs[c.id]);
 return `<div class="panel"><div class="section-kicker">STORY / EMOTIONAL ARC</div><h2>💗 캐릭터 감정 변화 타임라인</h2><p class="muted">사건 전후의 감정 상태를 -100(매우 부정적)부터 +100(매우 긍정적)까지 표시합니다. 이 값은 창작용 상대 지표이며 실제 심리 진단이 아닙니다.</p><label>캐릭터 선택</label><select id="ea-target" onchange="eaSelection(this.value)">${db.characters.map(x=>`<option value="${eaEscape(x.id)}" ${x.id===c.id?'selected':''}>${eaEscape(x.name)}</option>`).join('')}</select><div class="actions" style="margin:12px 0"><button class="primary" id="ea-run" onclick="eaAnalyze()" ${es.length?'':'disabled'}>✨ AI로 사건별 감정 변화 제안</button><button onclick="eaManual()" ${es.length?'':'disabled'}>직접 기록하기</button></div><p class="ea-small">현재 캐릭터의 사건과 캐릭터 미지정 사건을 분석 대상으로 표시합니다. AI가 제안한 결과는 검토 후 선택 저장해야 반영됩니다. 기존 사건 내용은 변경하지 않습니다.</p><div id="ea-status" role="status" aria-live="polite"></div>${es.length?`<p class="ea-small">분석 대상 ${es.length}개 사건 · 저장된 감정 변화 ${saved.length}개</p>`:'<p class="muted">먼저 서사 아카이브에 사건을 등록해 주세요.</p>'}${saved.length?eaChart(saved,c.id):'<p class="ea-small">저장된 감정 변화가 없습니다. AI 제안 또는 직접 기록을 시작해 주세요.</p>'}<div id="ea-review"></div></div>`;
}
function eaChart(events,cid){const w=740,h=280,left=48,right=25,top=28,bottom=65,iw=w-left-right,ih=h-top-bottom;const yy=v=>top+(100-eaClamp(v))/200*ih;const pts=[];events.forEach((e,i)=>{const x=left+(events.length===1?iw/2:i*iw/(events.length-1));const a=e.emotionArcs[cid];pts.push([x,yy(a.before),e,'before'],[x+Math.min(12,iw/Math.max(2,events.length*3)),yy(a.after),e,'after']);});const coords=pts.map(p=>`${p[0]},${p[1]}`).join(' ');return `<div class="ea-entry"><h3>감정 흐름 · 사건 전 → 사건 후</h3><svg class="ea-svg" viewBox="0 0 ${w} ${h}" role="img" aria-label="캐릭터 사건별 감정 변화 선 그래프">${[-100,-50,0,50,100].map(v=>`<line x1="${left}" y1="${yy(v)}" x2="${w-right}" y2="${yy(v)}" stroke="#e8e1f0"/><text x="${left-8}" y="${yy(v)+4}" text-anchor="end" fill="#716a82" font-size="12">${v}</text>`).join('')}<polyline points="${coords}" fill="none" stroke="#7661c6" stroke-width="2.5" stroke-linejoin="round"/>${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4.5" fill="${p[3]==='before'?'#b5a9cf':'#7661c6'}"><title>${eaEscape(p[2].title)} · ${p[3]==='before'?'전':'후'}: ${p[3]==='before'?p[2].emotionArcs[cid].before:p[2].emotionArcs[cid].after}</title></circle>`).join('')}${events.map((e,i)=>`<text x="${left+(events.length===1?iw/2:i*iw/(events.length-1))}" y="${h-30}" font-size="11" text-anchor="middle" fill="#716a82">${eaEscape((e.title||'사건').slice(0,7))}</text>`).join('')}</svg><p class="ea-small">연한 점: 사건 전 / 진한 점: 사건 후 · 사건 날짜순 정렬</p>${events.map(e=>{const a=e.emotionArcs[cid];return `<div class="ea-entry"><b>${eaEscape(e.date)} · ${eaEscape(e.title)}</b> <span class="ea-badge">${a.before} → ${a.after}</span><p>${eaEscape(a.reason||'')}</p><div class="actions"><button onclick="eaEditOne('${eaEscape(e.id)}')">이 사건 수정</button><button onclick="eaRemoveOne('${eaEscape(e.id)}')">기록 삭제</button></div></div>`}).join('')}</div>`}
function eaManual(){const c=char(window.eaCharacter);if(!c)return;emotionDraft=eaEvents(c.id).map(e=>({eventId:e.id,before:e.emotionArcs?.[c.id]?.before??0,after:e.emotionArcs?.[c.id]?.after??0,reason:e.emotionArcs?.[c.id]?.reason||'',selected:true}));eaReview();}
function eaEditOne(eventId){const c=char(window.eaCharacter),e=db.events.find(x=>x.id===eventId);if(!c||!e)return;emotionDraft=[{eventId,before:e.emotionArcs?.[c.id]?.before??0,after:e.emotionArcs?.[c.id]?.after??0,reason:e.emotionArcs?.[c.id]?.reason||'',selected:true}];eaReview();}
function eaRemoveOne(eventId){const c=char(window.eaCharacter),e=db.events.find(x=>x.id===eventId);if(!c||!e||!confirm('이 사건의 감정 변화 기록만 삭제할까요? 사건 자체는 유지됩니다.'))return;if(e.emotionArcs)delete e.emotionArcs[c.id];save();render()}
function eaReview(){const el=document.getElementById('ea-review');if(!el||!emotionDraft)return;el.innerHTML=`<div class="ea-entry"><h3>검토 후 저장</h3><p class="ea-small">AI의 추정은 틀릴 수 있습니다. 사건과 원작 설정을 확인하고, 필요한 항목만 선택하세요.</p>${emotionDraft.map((r,i)=>{const e=db.events.find(x=>x.id===r.eventId);if(!e)return '';return `<div class="ea-entry"><label><input type="checkbox" ${r.selected?'checked':''} onchange="emotionDraft[${i}].selected=this.checked"> 적용</label> <b>${eaEscape(e.title)}</b><div class="ea-grid"><div><label>사건 전 감정값 (-100 ~ 100)</label><input type="number" min="-100" max="100" value="${eaClamp(r.before)}" onchange="emotionDraft[${i}].before=eaClamp(this.value)"></div><div><label>사건 후 감정값 (-100 ~ 100)</label><input type="number" min="-100" max="100" value="${eaClamp(r.after)}" onchange="emotionDraft[${i}].after=eaClamp(this.value)"></div></div><label>변화 이유 · 원문 근거</label><textarea onchange="emotionDraft[${i}].reason=this.value">${eaEscape(r.reason)}</textarea></div>`}).join('')}<div class="actions"><button class="primary" onclick="eaSave()">선택한 사건 기록 저장</button><button onclick="emotionDraft=null;document.getElementById('ea-review').innerHTML=''">취소</button></div></div>`;el.scrollIntoView({behavior:'smooth',block:'nearest'});}
function eaSave(){const c=char(window.eaCharacter);if(!c||!emotionDraft)return;let n=0;for(const r of emotionDraft){if(!r.selected)continue;const e=db.events.find(x=>x.id===r.eventId);if(!e)continue;e.emotionArcs=e.emotionArcs||{};e.emotionArcs[c.id]={before:eaClamp(r.before),after:eaClamp(r.after),reason:String(r.reason||'').slice(0,1200),updatedAt:new Date().toISOString()};n++}emotionDraft=null;save();render();alert(n+'개 사건의 감정 변화를 저장했습니다.');}
async function eaAnalyze(){const c=char(window.eaCharacter),es=c&&eaEvents(c.id);if(!c||!es?.length)return;const btn=document.getElementById('ea-run'),status=document.getElementById('ea-status');btn.disabled=true;status.textContent='AI가 사건의 감정 흐름을 분석 중입니다…';try{const subset=es.slice(0,18);const payload={character:{name:c.name,personality:c.personality,traits:c.traits,values:c.values,stress:c.stress,goal:c.goal,fear:c.fear,secret:c.secret},events:subset.map(e=>({id:e.id,date:e.date,title:e.title,summary:String(e.summary||'').slice(0,1100),dialogue:String(e.dialogue||'').slice(0,700),emotion:e.emotion}))};const answer=await aiRequest([{role:'system',content:'당신은 창작 캐릭터의 감정 서사 분석 보조자입니다. JSON 객체만 출력하세요. {"events":[{"id":"입력한 사건 id","before":0,"after":0,"reason":"구체적 근거와 불확실성"}]} 형태로 답하세요. 점수 범위 -100~100, -100 매우 부정적, 0 중립, 100 매우 긍정적입니다. 감정의 강도가 아니라 정서적 방향입니다. 각 사건의 전후를 추론하되 근거가 부족하면 중립에 가깝게 하고 추정임을 명시하세요. 캐릭터의 성별이나 확정 설정을 추측하거나 변경하지 마세요.'},{role:'user',content:JSON.stringify(payload)}]);const cleaned=answer.replace(/^```(?:json)?\s*/i,'').replace(/```\s*$/,'').trim();let parsed;try{parsed=JSON.parse(cleaned)}catch{const a=cleaned.indexOf('{'),b=cleaned.lastIndexOf('}');if(a<0||b<=a)throw Error('AI 응답이 JSON 형식이 아닙니다. 다시 시도해 주세요.');parsed=JSON.parse(cleaned.slice(a,b+1));}const allowed=new Set(subset.map(e=>e.id));emotionDraft=(Array.isArray(parsed.events)?parsed.events:[]).filter(x=>allowed.has(x.id)).map(x=>({eventId:x.id,before:eaClamp(x.before),after:eaClamp(x.after),reason:String(x.reason||'').slice(0,1200),selected:true}));if(!emotionDraft.length)throw Error('분석할 사건 결과가 없습니다.');status.textContent='AI 제안 '+emotionDraft.length+'건을 받았습니다. 확인 후 저장해 주세요.'+(es.length>18?' 처음 18개 사건만 분석했습니다.':'');eaReview();}catch(e){status.textContent='분석 실패: '+e.message}finally{btn.disabled=false;}}

async function motivationAnalyze(){const c=motivationCharacter();if(!c)return;const btn=document.getElementById('mt-run'),status=document.getElementById('mt-status'),context=document.getElementById('mt-context')?.value.trim()||'';btn.disabled=true;status.textContent='AI가 인물의 목표와 갈등 구조를 분석하고 있습니다…';try{const payload={character:{name:c.name,work:c.work,traits:c.traits,personality:c.personality,values:c.values,stress:c.stress,backstory:c.backstory,goal:c.goal,fear:c.fear,secret:c.secret,role:c.role,voiceDictionary:c.voiceDictionary||{}},existingMap:c.motivationMap||{},relations:db.relations.filter(r=>r.a===c.id||r.b===c.id).slice(0,20).map(r=>({a:name(r.a),b:name(r.b),type:r.type,desc:r.desc})),events:db.events.filter(e=>JSON.stringify(e).includes(c.id)||JSON.stringify(e).includes(c.name)).slice(0,20).map(e=>({title:e.title,date:e.date,summary:e.summary})),additionalContext:context};const raw=await aiRequest([{role:'system',content:'당신은 창작 캐릭터의 욕망과 갈등 구조를 분석하는 서사 편집자입니다. 반드시 JSON 객체 하나만 반환하세요. 키: surfaceGoal,coreDesire,innerNeed,lack,fear,innerConflict,outerConflict,choiceArc,evidence. 모든 값은 한국어 문자열로 작성하세요. 표면적 목표와 진짜 욕망, 내면의 필요를 구분하고 서로의 인과관계를 구체적으로 설명하세요. 자료에 없는 과거·사건·관계를 사실로 창작하지 마세요. 추론은 반드시 가설이라고 표시하고 evidence에서 근거와 불확실성을 명시하세요. 캐릭터의 기존 확정 설정과 모순될 때는 덮어쓰지 말고 충돌을 알려주세요. 실제 심리 진단이 아닌 창작 보조 분석입니다.'},{role:'user',content:JSON.stringify(payload)}]);const parsed=aiSafeJson(raw);if(!parsed||typeof parsed!=='object'||Array.isArray(parsed))throw Error('AI 분석 형식이 올바르지 않습니다.');if(motivationCharacter()?.id!==c.id)throw Error('분석 중 캐릭터가 변경되었습니다.');motivationDraft=Object.fromEntries(motivationFields.map(([k])=>[k,typeof parsed[k]==='string'?parsed[k].slice(0,4000):'']));motivationDraftId=c.id;status.textContent='분석이 완료되었습니다. 아래에서 선택 항목을 검토해 주세요.';motivationReview('AI 분석 결과')}catch(e){status.textContent='분석 실패: '+e.message}finally{btn.disabled=false}}

async function lfContinuityAnalyze(){const btn=document.getElementById('lf-consistency-run'),status=document.getElementById('lf-consistency-status');if(!db.characters.length&&!db.events.length){alert('먼저 캐릭터 또는 사건을 등록해 주세요.');return}const context=lfContinuityContext(),notes=document.getElementById('lf-consistency-notes')?.value||'';if(btn)btn.disabled=true;if(status)status.textContent='설정을 비교하고 있습니다…';try{const sys='당신은 창작 작품의 연속성 검수자입니다. 오직 제공된 기록에 근거해 설정 충돌 가능성을 찾으세요. 단순 정보 부재는 충돌이 아닙니다. 캐릭터 성장, 거짓말, 시간 경과, 관점 차이는 의도된 변화일 수 있으니 구분하세요. IF 시나리오는 정사 근거로 취급하지 마세요. 추측으로 새로운 사실을 만들지 마세요. 반드시 JSON 객체만 반환: {"issues":[{"category":"인물|관계|시간|호칭|사건|기타","severity":"높음|중간|낮음","title":"간단 제목","description":"어떤 기록이 충돌하는지","evidence":[{"sourceType":"character|relation|event","sourceId":"실제 제공된 id","quote":"해당 기록에서 확인되는 짧은 근거"}],"suggestion":"확인 또는 수정 제안","possiblyIntentional":true,"confidence":"높음|중간|낮음"}]}. 충돌이 없으면 issues 빈 배열. 최대 12건.';const raw=await aiRequest([{role:'system',content:sys},{role:'user',content:JSON.stringify({context,authorNotes:notes})}]);const data=lfContinuityParse(raw);if(!Array.isArray(data.issues))throw Error('AI 결과에 issues 배열이 없습니다.');const validIds=new Set([...db.characters,...db.relations,...db.events].map(x=>String(x.id)));lfContinuityDraft=data.issues.slice(0,12).map(x=>({id:id(),category:String(x.category||'기타'),severity:String(x.severity||'낮음'),title:String(x.title||'검토 항목'),description:String(x.description||''),evidence:(Array.isArray(x.evidence)?x.evidence:[]).filter(e=>validIds.has(String(e.sourceId))).map(e=>({sourceType:String(e.sourceType||''),sourceId:String(e.sourceId),quote:String(e.quote||'')})),suggestion:String(x.suggestion||''),possiblyIntentional:!!x.possiblyIntentional,confidence:String(x.confidence||'낮음'),decision:'검토 필요'}));lfContinuityRender();if(status)status.textContent=`${lfContinuityDraft.length}개 검토 항목을 찾았습니다. 원본 설정은 변경되지 않았습니다.`}catch(e){if(status)status.textContent='검사 실패: '+e.message}finally{if(btn)btn.disabled=false}}
function lfContinuitySource(e){const item=e.sourceType==='character'?char(e.sourceId):e.sourceType==='relation'?db.relations.find(x=>x.id===e.sourceId):db.events.find(x=>x.id===e.sourceId);return item?(item.name||item.title||(name(item.a)+' × '+name(item.b))):'출처를 확인할 수 없음'}
function lfContinuityRender(){const el=document.getElementById('lf-consistency-result');if(!el)return;el.innerHTML=lfContinuityDraft.length?`<div class="panel" style="margin-top:16px"><h3>검사 결과 · ${lfContinuityDraft.length}건</h3><p class="muted">출처를 직접 확인하고 판정하세요. AI가 제안한 문구는 원본 데이터에 적용되지 않습니다.</p>${lfContinuityDraft.map((x,i)=>`<div class="item"><div class="pillbar"><span class="chip">${esc(x.category)}</span><span class="chip">중요도 ${esc(x.severity)}</span><span class="chip">확신 ${esc(x.confidence)}</span>${x.possiblyIntentional?'<span class="chip">의도된 변화 가능</span>':''}</div><h3>${i+1}. ${esc(x.title)}</h3><p style="white-space:pre-wrap">${esc(x.description)}</p><b>기록 근거</b>${x.evidence.length?x.evidence.map(e=>`<p class="muted">${esc(lfContinuitySource(e))}: ${esc(e.quote)}</p>`).join(''):'<p class="muted">연결된 기록 근거가 없습니다. 원문을 직접 확인하세요.</p>'}<label>검토 및 수정 제안</label><textarea rows="3" data-lf-note="${i}">${esc(x.suggestion)}</textarea><label>작가 판정</label><select data-lf-decision="${i}">${['검토 필요','실제 충돌','의도된 설정','문제 없음'].map(v=>`<option ${x.decision===v?'selected':''}>${v}</option>`).join('')}</select></div>`).join('')}<div class="actions"><button class="primary" type="button" onclick="lfContinuitySave()">검토 기록 저장</button></div></div>`:'<div class="item" style="margin-top:14px">현재 제공된 자료에서 AI가 지적한 충돌은 없습니다. 설정에 오류가 없다는 보장은 아닙니다.</div>'}
function lfContinuitySave(){if(!lfContinuityDraft.length)return;const items=lfContinuityDraft.map((x,i)=>({...x,suggestion:document.querySelector(`[data-lf-note="${i}"]`)?.value||x.suggestion,decision:document.querySelector(`[data-lf-decision="${i}"]`)?.value||'검토 필요'}));if(!Array.isArray(db.continuityReviews))db.continuityReviews=[];db.continuityReviews.push({id:id(),title:'설정 충돌 검토',createdAt:new Date().toISOString(),items});save();lfContinuityDraft=[];render();alert('검토 기록을 저장했습니다. 원본 프로필과 사건은 변경되지 않았습니다.')}
function lfContinuityOpen(rid){const r=lfContinuityRecords().find(x=>x.id===rid);if(!r)return;lfContinuityDraft=(r.items||[]).map(x=>({...x}));lfContinuityRender();const el=document.getElementById('lf-consistency-result');el?.scrollIntoView({behavior:'smooth',block:'start'})}
function lfContinuityDelete(rid){if(!confirm('이 검토 기록만 삭제할까요? 원본 설정에는 영향이 없습니다.'))return;db.continuityReviews=lfContinuityRecords().filter(x=>x.id!==rid);save();render()}
</script></body></html>
