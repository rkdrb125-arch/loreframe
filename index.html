ine-height:1.8}.hero .primary{background:#fff;color:#4435a5}.eyebrow{font-size:11px;font-weight:800;letter-spacing:2px;color:#c9c0ff}.insight{background:#f8f7ff;border:1px solid #ebe7fa;border-radius:14px;padding:17px;margin:12px 0}.insight b{color:#4d3db5}.insight p{margin:7px 0;line-height:1.85}.meter{height:8px;background:#eae6f5;border-radius:99px;overflow:hidden;margin:7px 0 12px}.meter>i{display:block;height:100%;background:linear-gradient(90deg,#aa9af4,#5745d5);border-radius:99px}.micro{font-size:12px;color:#827c97}.pillbar{display:flex;gap:7px;flex-wrap:wrap}.pillbar button{font-size:12px;padding:9px 12px}.section-kicker{font-size:12px;font-weight:800;color:#8170d8;text-transform:uppercase;letter-spacing:1.5px}.profile-head{display:flex;align-items:center;gap:14px}.avatar{display:grid;place-items:center;flex-shrink:0;width:52px;height:52px;border-radius:17px;background:linear-gradient(140deg,#e2dcff,#b5a8f5);color:#4d3ab3;font-size:23px;font-weight:800}.statgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.statcard{padding:18px;background:white;border:1px solid #eeeaf5;border-radius:18px}.statcard .metric{font-size:29px}.formnote{font-size:12px;color:#857d9b;margin-top:4px}.empty{padding:35px 20px;text-align:center;background:#faf9ff;border:1px dashed #dcd5f3;border-radius:16px;color:#827b9a}.empty:before{content:'✧';display:block;font-size:32px;color:#9383e0;margin-bottom:8px}@media(max-width:650px){.wrap{padding:12px}.panel{padding:18px;border-radius:18px}.hero{padding:24px}.statgrid{grid-template-columns:repeat(2,minmax(0,1fr))}header{padding:29px 18px}nav button{font-size:12px;padding:11px 12px}}

</style></head><body><header><div class="brand-header"><div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 64 64" width="52" height="52" xmlns="http://www.w3.org/2000/svg"><rect x="7" y="7" width="50" height="50" rx="13" fill="none" stroke="#c9b9ff" stroke-width="1.8"/><path d="M20 19v26h19" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/><path d="M42 17l2.6 6.4L51 26l-6.4 2.6L42 35l-2.6-6.4L33 26l6.4-2.6z" fill="#c7b5ff"/></svg></div><div class="brand-copy"><div class="eyebrow">CHARACTER · RELATIONSHIP · STORY</div><h1>LOREFRAME <span class="brand-edition">STUDIO 5.0</span></h1><p>인물의 내면을 읽고, 관계를 엮고, 이야기를 남기다.</p></div></div><div class="brand-caption">EVERY CHARACTER HAS A STORY. <span>✦</span></div></header><main class="wrap"><nav id="nav"></nav><section id="view"></section><footer>계정별 서버 저장 · API 키 암호화 보관 · 백업 내보내기 지원</footer></main><div id="account-overlay" style="position:fixed;inset:0;z-index:9999;background:#151423f5;display:flex;align-items:center;justify-content:center;padding:20px"><div class="panel" style="width:min(440px,100%);max-height:90vh;overflow:auto"><div class="section-kicker">LOREFRAME / PRIVATE WORKSPACE</div><h2>내 창작 공간에 로그인</h2><p class="muted">계정별로 캐릭터와 관계, 서사를 따로 저장합니다.</p><form id="account-form"><label>이메일</label><input id="account-email" type="email" required autocomplete="username"><label>비밀번호 (10자 이상)</label><input id="account-password" type="password" required minlength="10" autocomplete="current-password"><div class="actions" style="margin-top:16px"><button class="primary" type="submit">로그인</button><button type="button" onclick="accountAction('register')">새 계정 만들기</button></div></form><p id="account-message" class="ai-note" role="status">실제 서버를 실행해야 로그인과 클라우드 저장을 이용할 수 있습니다.</p></div></div><script>
let currentUser=null,syncTimer=null;const KEY='persona_archive_v1';let db;try{db=JSON.parse(localStorage.getItem(KEY))||{characters:[],relations:[],events:[]}}catch{db={characters:[],relations:[],events:[]}};let tab='home',editId=null;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),save=()=>{if(!currentUser)return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>api('/api/data',{method:'PUT',body:JSON.stringify(db)}).then(()=>setSync('클라우드 저장 완료')).catch(e=>setSync('저장 실패: '+e.message)),350)},id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7),char=id=>db.characters.find(x=>x.id===id),name=id=>char(id)?.name||'삭제된 캐릭터',opt=(selected='')=>db.characters.map(x=>`<option value="${x.id}" ${x.id===selected?'selected':''}>${esc(x.name)}</option>`).join(''),empty=msg=>`<p class="muted">${msg}</p>`;
const tabs=[['home','🏠 대시보드'],['characters','👤 캐릭터'],['analysis','🧠 성격 분석'],['relations','💞 관계 분석'],['graph','🕸️ 관계도'],['couples','💗 커플 리포트'],['events','📚 서사 아카이브'],['timeline','🗓️ 타임라인'],['guide','✦ 분석 가이드'],['ai','✦ AI 스튜디오'],['backup','⚙️ 백업']];function go(t){tab=t;editId=null;render();window.scrollTo({top:0,behavior:'smooth'})}function render(){ $('#nav').innerHTML=tabs.map(([k,n])=>`<button class="${tab===k?'active':''}" onclick="go('${k}')">${n}</button>`).join('');$('#view').innerHTML=({home,characters,analysis,relations,graph,couples,events,timeline,guide,ai,backup})[tab]();if(tab==='couples')renderCouple();}
function home(){return `<div class="grid three">${[['캐릭터',db.characters.length,'characters'],['관계',db.relations.length,'relations'],['기록된 사건',db.events.length,'events']].map(([n,v,t])=>`<div class="panel" onclick="go('${t}')" style="cursor:pointer"><div class="tag">${n}</div><div class="metric">${v}</div></div>`).join('')}</div><div class="panel"><h2>나만의 서사 관리실 ✨</h2><p>캐릭터를 등록하고 관계를 연결한 뒤, 중요한 사건을 아카이브에 쌓아 보세요. 관계도와 타임라인은 자동으로 만들어집니다.</p><div class="actions"><button class="primary" onclick="go('characters')">캐릭터 등록하기</button><button onclick="go('events')">사건 기록하기</button></div></div><div class="panel"><h2>최근 기록</h2>${db.events.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,4).map(x=>`<div class="item"><b>${esc(x.title)}</b><span class="chip">${esc(x.date)}</span><p>${esc(x.summary)}</p></div>`).join('')||empty('아직 기록이 없습니다.')}</div>`}
function characters(){let c=char(editId)||{};return `<div class="panel"><h2>${c.id?'캐릭터 수정':'새 캐릭터 등록'}</h2><form id="cf"><div class="grid"><div><label>이름 *</label><input name="name" required value="${esc(c.name)}"></div><div><label>역할 / 작품</label><input name="work" value="${esc(c.work)}" placeholder="작품명 또는 세계관"></div><div><label>나이</label><input name="age" value="${esc(c.age)}" placeholder="선택 입력"></div><div><label>성격 키워드</label><input name="traits" value="${esc(c.traits)}" placeholder="원칙적, 다정함, 완벽주의"></div></div><div class="grid"><div><label>MBTI (직접 설정)</label><select name="mbti"><option value="">미설정</option>${['INTJ','INTP','ENTJ','ENTP','INFJ','INFP','ENFJ','ENFP','ISTJ','ISFJ','ESTJ','ESFJ','ISTP','ISFP','ESTP','ESFP'].map(v=>`<option ${c.mbti===v?'selected':''}>${v}</option>`).join('')}</select></div><div><label>에니어그램 (직접 설정)</label><select name="enneagram"><option value="">미설정</option>${Array.from({length:9},(_,i)=>`<option ${c.enneagram===String(i+1)?'selected':''}>${i+1}</option>`).join('')}</select></div><div><label>애착 유형 (직접 설정)</label><select name="attachment">${['미설정','안정형','불안형','회피형','혼란형'].map(v=>`<option ${c.attachment===v?'selected':''}>${v}</option>`).join('')}</select></div><div><label>서사 역할</label><input name="role" value="${esc(c.role)}" placeholder="주인공, 조력자, 대립자"></div></div><label>핵심 가치관</label><textarea name="values" placeholder="이 인물이 절대 포기하지 않는 신념은 무엇인가요?">${esc(c.values)}</textarea><label>스트레스 상황에서의 반응</label><textarea name="stress" placeholder="압박, 배신, 상실에 어떻게 반응하나요?">${esc(c.stress)}</textarea><label>성격과 행동</label><textarea name="personality" placeholder="평소 말투, 장점, 단점, 갈등 반응">${esc(c.personality)}</textarea><label>과거와 배경</label><textarea name="backstory">${esc(c.backstory)}</textarea><label>욕망 / 목표</label><textarea name="goal">${esc(c.goal)}</textarea><label>비밀 / 숨기는 감정</label><textarea name="secret" placeholder="겉으로 드러내지 않는 감정, 과거의 비밀">${esc(c.secret)}</textarea><label>두려움 / 약점</label><textarea name="fear">${esc(c.fear)}</textarea>${bigFields(c)}<div class="actions"><button class="primary">저장하기</button>${c.id?'<button type="button" onclick="editId=null;render()">취소</button>':''}</div></form></div><div class="panel"><h2>등록된 캐릭터 (${db.characters.length})</h2>${db.characters.map(x=>`<div class="item"><b>${esc(x.name)}</b> <span class="chip">${esc(x.work||'작품 미지정')}</span><p>${esc(x.traits||x.personality||'설명 없음')}</p><div class="actions"><button onclick="editId='${x.id}';render()">수정</button><button onclick="tab='analysis';render();$('#target').value='${x.id}';showAnalysis()">분석</button><button class="danger" onclick="removeChar('${x.id}')">삭제</button></div></div>`).join('')||empty('첫 캐릭터를 등록해 보세요.')}</div>`}
function removeChar(cid){if(!confirm('캐릭터를 삭제할까요? 연결된 관계도 함께 삭제됩니다.'))return;db.characters=db.characters.filter(x=>x.id!==cid);db.relations=db.relations.filter(x=>x.a!==cid&&x.b!==cid);save();render()}
function analysis(){return `<div class="panel"><h2>🧠 캐릭터 성격 분석</h2><p class="muted">입력된 설정을 바탕으로 성격의 동기와 갈등을 정리하는 창작 보조 분석입니다. MBTI·에니어그램·Big 5의 정확한 판정에는 별도 질문지나 AI 연동이 필요합니다.</p>${db.characters.length?`<label>분석 대상</label><select id="target">${opt()}</select><div class="actions"><button class="primary" onclick="showAnalysis()">기본 분석 보기</button><button type="button" onclick="runIntegratedAI('character')">✨ AI 성격 심층 분석</button></div><div id="result"></div><div id="integrated-character-result"></div>`:empty('캐릭터를 먼저 등록해 주세요.')}</div>`}
function showAnalysis(){const x=char($('#target').value);if(!x)return;const p=[x.traits,x.personality,x.backstory].filter(Boolean).join(' ');const strengths=x.traits||'설정된 성격 키워드가 없습니다';const motive=x.goal||'목표를 입력하면 핵심 동기를 분석할 수 있습니다';const fear=x.fear||'약점을 입력하면 갈등 요소를 정리할 수 있습니다';$('#result').innerHTML=`<div class="item"><h3>${esc(x.name)}의 캐릭터 해석</h3><span class="chip">핵심 성향</span><p>${esc(strengths)}</p><span class="chip">행동의 동기</span><p>${esc(motive)}</p><span class="chip">내적 갈등</span><p>${esc(fear)}</p><span class="chip">성장 서사 제안</span><p>${esc(x.name)}이(가) '${esc(motive)}'을(를) 추구하는 과정에서 '${esc(fear)}'과(와) 마주하는 사건을 배치해 보세요. 선택의 대가를 드러내면 성격 변화가 설득력 있어집니다.</p><span class="chip">성격 이론 참고</span><p>MBTI·에니어그램·Big 5는 이 입력만으로 신뢰성 있게 확정할 수 없습니다. 인물의 구체적 선택과 반응을 더 기록해 보세요.</p></div>`}
function relations(){let r=db.relations.find(x=>x.id===editId)||{};return `<div class="panel"><h2>${r.id?'관계 수정':'새 관계 만들기'}</h2>${db.characters.length<2?empty('관계를 만들려면 캐릭터 2명 이상이 필요합니다.'):`<form id="rf"><div class="grid"><div><label>캐릭터 A</label><select name="a">${opt(r.a)}</select></div><div><label>캐릭터 B</label><select name="b">${opt(r.b||db.characters[1]?.id)}</select></div><div><label>관계 유형</label><select name="type">${['연인','친구','라이벌','가족','동료','짝사랑','적대','기타'].map(v=>`<option ${r.type===v?'selected':''}>${v}</option>`).join('')}</select></div><div><label>관계 상태</label><input name="status" value="${esc(r.status)}" placeholder="서먹함, 신뢰 형성 중"></div></div><label>관계 설명</label><textarea name="desc" placeholder="서로에게 느끼는 감정, 공통점, 차이점">${esc(r.desc)}</textarea><label>관계의 전환점</label><textarea name="turning" placeholder="두 사람의 관계를 뒤바꾼 사건">${esc(r.turning)}</textarea><label>관계의 강점</label><textarea name="strength" placeholder="서로를 지탱해주는 부분">${esc(r.strength)}</textarea><label>갈등 요소</label><textarea name="conflict">${esc(r.conflict)}</textarea><div class="actions"><button class="primary">관계 저장</button></div></form>`}</div><div class="panel"><h2>관계 목록</h2>${db.relations.map(x=>`<div class="item"><b>${esc(name(x.a))} × ${esc(name(x.b))}</b><span class="chip">${esc(x.type)}</span><p>${esc(x.desc||'관계 설명 없음')}</p><div class="actions"><button onclick="showRelation('${x.id}')">관계 해석</button><button onclick="editId='${x.id}';render()">수정</button><button class="danger" onclick="removeRelation('${x.id}')">삭제</button></div><div id="rel-${x.id}"></div></div>`).join('')||empty('등록된 관계가 없습니다.')}</div>`}
function showRelation(rid){const r=db.relations.find(x=>x.id===rid),a=char(r.a),b=char(r.b);if(!a||!b)return;$('#rel-'+rid).innerHTML=`<div class="item"><h3>💞 관계 해석</h3><div class="actions"><button type="button" onclick="runIntegratedAI('relation','${rid}')">✨ AI 관계 심층 분석</button></div><p><b>관계의 중심:</b> ${esc(r.status||r.type)}</p><p><b>${esc(a.name)}의 목표:</b> ${esc(a.goal||'미설정')}</p><p><b>${esc(b.name)}의 목표:</b> ${esc(b.goal||'미설정')}</p><p><b>갈등 가능성:</b> ${esc(r.conflict||'서로의 목표가 충돌하는 순간을 구체적으로 설정해 보세요.')}</p><p><b>서사 제안:</b> 두 인물이 같은 사건을 서로 다른 가치관으로 해석하는 장면을 기록하면 관계 변화가 선명해집니다.</p><p class="muted">궁합 점수는 근거 없는 숫자 대신 서사적 분석으로 제공합니다.</p></div>`}
function removeRelation(rid){if(confirm('관계를 삭제할까요?')){db.relations=db.relations.filter(x=>x.id!==rid);save();render()}}
function graph(){let cs=db.characters;let W=680,H=Math.max(330,cs.length*35+160),cx=W/2,cy=H/2,R=Math.min(235,H/2-60),pos=Object.fromEntries(cs.map((x,i)=>[x.id,{x:cx+R*Math.cos(2*Math.PI*i/cs.length-Math.PI/2),y:cy+R*Math.sin(2*Math.PI*i/cs.length-Math.PI/2)}]));return `<div class="panel"><h2>🕸️ 캐릭터 관계도</h2><div class="actions"><button type="button" onclick="runIntegratedAI('graph')">✨ AI 관계망 분석</button></div><div id="integrated-graph-result"></div><p class="muted">캐릭터가 노드로, 등록된 관계가 선으로 표시됩니다.</p>${cs.length?`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="캐릭터 관계도">${db.relations.filter(r=>pos[r.a]&&pos[r.b]).map(r=>`<line x1="${pos[r.a].x}" y1="${pos[r.a].y}" x2="${pos[r.b].x}" y2="${pos[r.b].y}" stroke="#a79be7" stroke-width="3"/><text x="${(pos[r.a].x+pos[r.b].x)/2}" y="${(pos[r.a].y+pos[r.b].y)/2-7}" text-anchor="middle" font-size="12" fill="#6357a7">${esc(r.type)}</text>`).join('')}${cs.map(c=>`<circle cx="${pos[c.id].x}" cy="${pos[c.id].y}" r="39" fill="#6256be"/><text x="${pos[c.id].x}" y="${pos[c.id].y+5}" text-anchor="middle" font-size="13" font-weight="bold" fill="white">${esc(c.name.slice(0,7))}</text>`).join('')}</svg>`:empty('캐릭터를 등록하면 관계도가 나타납니다.')}</div>`}
function events(){let e=db.events.find(x=>x.id===editId)||{};return `<div class="panel"><h2>${e.id?'사건 수정':'서사 사건 기록'}</h2><form id="ef"><div class="grid"><div><label>사건 제목 *</label><input name="title" required value="${esc(e.title)}"></div><div><label>날짜 / 순서 *</label><input type="date" name="date" required value="${esc(e.date||new Date().toLocaleDateString('en-CA'))}"></div><div><label>카테고리</label><select name="category">${['만남','갈등','일상','전환점','이별','화해','기타'].map(v=>`<option ${e.category===v?'selected':''}>${v}</option>`).join('')}</select></div><div><label>관련 캐릭터</label><select name="character"><option value="">전체 / 미지정</option>${opt(e.character)}</select></div></div><label>사건 내용</label><textarea name="summary">${esc(e.summary)}</textarea><label>중요 대사 / 장면</label><textarea name="dialogue" placeholder="인상적인 대사 또는 장면 묘사">${esc(e.dialogue)}</textarea><div class="vizcard"><label>이 사건의 감정 강도 <output id="emo-out">${esc(e.intensity??50)}</output> / 100</label><input type="range" name="intensity" min="0" max="100" value="${esc(e.intensity??50)}" oninput="document.getElementById('emo-out').textContent=this.value"><p class="reportnote">주관적인 장면 감정 강도입니다. 타임라인 그래프에 반영됩니다.</p></div><label>감정 변화 / 의미</label><textarea name="emotion" placeholder="사건 전후 심리 변화">${esc(e.emotion)}</textarea><div class="actions"><button class="primary">사건 저장</button></div></form></div><div class="panel"><h2>서사 아카이브</h2>${db.events.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<div class="item"><span class="chip">${esc(x.category)}</span><span class="chip">${esc(x.date)}</span><b>${esc(x.title)}</b><p>${esc(x.summary)}</p>${x.dialogue?`<p><b>주요 장면:</b> ${esc(x.dialogue)}</p>`:''}${x.emotion?`<p><b>감정 변화:</b> ${esc(x.emotion)}</p>`:''}<div class="actions"><button onclick="editId='${x.id}';render()">수정</button><button class="danger" onclick="removeEvent('${x.id}')">삭제</button></div></div>`).join('')||empty('아직 등록된 사건이 없습니다.')}</div>`}
function removeEvent(eid){if(confirm('사건을 삭제할까요?')){db.events=db.events.filter(x=>x.id!==eid);save();render()}}
function timeline(){return `<div class="panel"><h2>🗓️ 이야기 타임라인</h2>${emotionChart()}${db.events.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(x=>`<div class="line"><div class="tag">${esc(x.date)} · ${esc(x.category)}</div><b>${esc(x.title)}</b>${x.character?`<span class="chip">${esc(name(x.character))}</span>`:''}<p>${esc(x.summary)}</p>${x.emotion?`<p class="muted">감정: ${esc(x.emotion)}</p>`:''}</div>`).join('')||empty('서사 아카이브에 사건을 등록하면 시간순으로 표시됩니다.')}</div>`}
function backup(){return `<div class="panel"><h2>⚙️ 데이터 관리</h2><p class="muted">현재 데이터는 이 기기의 브라우저에만 저장됩니다. 브라우저 데이터를 삭제하거나 기기를 바꾸면 사라질 수 있으니 JSON 파일로 백업하세요.</p><div class="actions"><button class="primary" onclick="download()">JSON 백업 다운로드</button><label style="margin:0"><input type="file" accept="application/json,.json" id="import" style="display:none" onchange="upload(event)"><button type="button" onclick="$('#import').click()">백업 가져오기</button></label></div><hr><button class="danger" onclick="resetAll()">전체 데이터 초기화</button></div>`}
function download(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='loreframe-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}async function upload(ev){try{let x=JSON.parse(await ev.target.files[0].text());if(!['characters','relations','events'].every(k=>Array.isArray(x[k])))throw Error('올바른 백업 파일이 아닙니다');if(confirm('현재 데이터를 백업 파일로 교체할까요?')){db=x;save();render()}}catch(e){alert('가져오기 실패: '+e.message)}}function resetAll(){if(confirm('모든 데이터를 삭제할까요? 복구할 수 없습니다.')){db={characters:[],relations:[],events:[]};save();go('home')}}
document.addEventListener('submit',ev=>{if(ev.target.id==='ai-save-char')return;ev.preventDefault();const f=ev.target,v=Object.fromEntries(new FormData(f));if(f.id==='couple-form'){saveCouple(f);return}if(f.id==='cf'){if(!v.name.trim())return;const x={id:editId||id(),...v};db.characters=editId?db.characters.map(z=>z.id===editId?x:z):[...db.characters,x]}if(f.id==='rf'){if(v.a===v.b)return alert('서로 다른 캐릭터를 선택해 주세요');const x={id:editId||id(),...v};db.relations=editId?db.relations.map(z=>z.id===editId?x:z):[...db.relations,x]}if(f.id==='ef'){const x={id:editId||id(),...v};db.events=editId?db.events.map(z=>z.id===editId?x:z):[...db.events,x]}editId=null;save();render()});

const AXES=[['trust','신뢰','서로의 말과 행동을 얼마나 믿는가'],['closeness','친밀감','감정을 얼마나 깊이 공유하는가'],['tension','긴장감','서로에게 느끼는 압박과 불안'],['dependence','상호 의존','서로에게 얼마나 기대는가'],['communication','소통','속마음과 갈등을 표현하는 정도'],['balance','힘의 균형','관계에서 주도권이 균등한 정도']];
function couples(){if(!db.relations.length)return `<div class="panel"><h2>💗 커플 다이내믹 리포트</h2><p class="muted">관계 분석에서 먼저 두 캐릭터를 연결해 주세요. 연인 외의 관계도 분석할 수 있습니다.</p><button class="primary" onclick="go('relations')">관계 만들기</button></div>`;return `<div class="panel no-print"><div class="section-kicker">RELATIONSHIP LAB / STUDIO 5.0</div><h2>💗 커플 다이내믹 리포트</h2><p class="muted">관계의 심리적 거리와 변화 단계를 직접 설계하고, 결과를 한 장의 리포트로 정리하세요. 점수는 창작자가 설정한 연출 지표이며 AI 판정이 아닙니다.</p><label>분석할 관계</label><select id="couple-select" onchange="renderCouple()">${db.relations.map(r=>`<option value="${r.id}">${esc(name(r.a))} × ${esc(name(r.b))} · ${esc(r.type)}</option>`).join('')}</select></div><div id="couple-report"></div>`}
function renderCouple(){let sel=$('#couple-select');if(!sel)return;let r=db.relations.find(x=>x.id===sel.value);if(!r)return;let a=char(r.a),b=char(r.b);if(!a||!b)return;let vals=Object.fromEntries(AXES.map(([k])=>[k,Math.min(100,Math.max(0,Number(r['axis_'+k]??50)))]));let phases=[['start','시작','첫인상 · 첫 만남 · 관계의 출발점'],['shift','전환','신뢰가 흔들리거나 가까워진 계기'],['future','미래','관계가 도달할 수 있는 다음 단계']];$('#couple-report').innerHTML=`<div class="couple-hero"><div class="mini-kicker" style="color:#e5d9ff">RELATIONSHIP DOSSIER</div><h2>${esc(a.name)} <span style="color:#f7bfd9">×</span> ${esc(b.name)}</h2><p>${esc(r.type)} · ${esc(r.status||'상태 미설정')}</p><p>${esc(r.desc||'두 사람의 관계 설명을 추가해 보세요.')}</p></div><div class="panel"><div class="section-kicker">01 / RELATIONSHIP DYNAMICS</div><h2>관계의 여섯 축</h2><form id="couple-form"><input type="hidden" name="rid" value="${r.id}"><div class="axis-grid">${AXES.map(([k,label,hint])=>`<div class="axis-card"><label><b>${label}</b><output id="axisout-${k}">${vals[k]}</output></label><div class="micro">${hint}</div><input type="range" min="0" max="100" name="axis_${k}" value="${vals[k]}" oninput="document.getElementById('axisout-${k}').textContent=this.value"></div>`).join('')}</div><h3>02 / 관계의 세 단계</h3><div class="phase-grid">${phases.map(([k,label,hint],i)=>`<div class="phase-card"><div class="mini-kicker">0${i+1} / ${label}</div><p class="micro">${hint}</p><textarea name="phase_${k}" placeholder="이 단계의 핵심 사건과 감정을 기록하세요">${esc(r['phase_'+k])}</textarea></div>`).join('')}</div><h3>03 / 서로 다른 시선</h3><div class="grid"><div><label>${esc(a.name)}이(가) 상대에게 원하는 것</label><textarea name="perspective_a" placeholder="겉으로 말하지 못하는 기대">${esc(r.perspective_a)}</textarea></div><div><label>${esc(b.name)}이(가) 상대에게 원하는 것</label><textarea name="perspective_b" placeholder="상대에게 바라는 변화">${esc(r.perspective_b)}</textarea></div></div><div class="actions no-print"><button class="primary">리포트 설정 저장</button><button type="button" onclick="window.print()">인쇄 / PDF로 저장</button></div></form></div><div class="panel"><div class="section-kicker">04 / CREATIVE INSIGHTS</div><h2>관계 구조 미리보기</h2>${AXES.map(([k,label])=>`<div><div style="display:flex;justify-content:space-between"><b>${label}</b><span>${vals[k]} / 100</span></div><div class="axisbar"><i style="width:${vals[k]}%"></i></div></div>`).join('')}<div class="report-questions"><div><b>친밀감과 신뢰</b><p>${vals.closeness>vals.trust?'감정적 거리는 가깝지만 확신이 부족한 설정입니다. 친밀한 순간에 의심이 끼어드는 장면을 실험해 보세요.':'서로를 믿는 정도와 가까움의 균형을 살펴보세요. 신뢰가 행동으로 드러나는 사건을 설계해 보세요.'}</p></div><div><b>긴장과 소통</b><p>${vals.tension>65&&vals.communication<45?'긴장감은 높고 소통은 적은 설정입니다. 말하지 않은 진심이 갈등을 키우는 장면에 적합합니다.':'두 인물이 같은 갈등을 어떻게 말하고 회피하는지 대비해 보세요.'}</p></div><div><b>의존과 주도권</b><p>${vals.dependence>65&&vals.balance<40?'의존도가 높고 주도권이 불균형한 설정입니다. 누가 먼저 독립적인 선택을 하는지가 전환점이 될 수 있습니다.':'서로에게 기대는 방식과 선택권을 누가 갖는지 구체적인 사건으로 표현해 보세요.'}</p></div><div><b>성장 가능성</b><p>두 사람이 처음과 같은 문제를 다시 만났을 때 어떤 선택을 달리할까요? 그 차이가 관계의 성장선이 됩니다.</p></div></div><p class="reportnote">위 해석은 창작자가 지정한 수치를 조건에 따라 정리한 것으로, 실제 심리 검사나 AI 분석이 아닙니다.</p></div>`}
function saveCouple(f){let v=Object.fromEntries(new FormData(f));let r=db.relations.find(x=>x.id===v.rid);if(!r)return;delete v.rid;Object.assign(r,v);save();renderCouple();alert('커플 리포트 설정을 저장했습니다.')}

const BIG=[['open','개방성'],['conscientious','성실성'],['extraversion','외향성'],['agreeable','우호성'],['neurotic','정서 민감성']];
function bigFields(c){return `<div class="vizcard"><h3>✦ Big 5 창작자 직접 평가</h3><p class="reportnote">캐릭터 설정에 맞게 0~100으로 직접 지정하세요. 심리검사나 AI 추정치가 아닙니다. 정서 민감성은 높을수록 감정 반응이 큰 설정입니다.</p><div class="vizgrid">${BIG.map(([k,label])=>`<div class="rangeitem"><label>${label} <output id="out-${k}">${esc(c['big_'+k]??50)}</output></label><input type="range" min="0" max="100" name="big_${k}" value="${esc(c['big_'+k]??50)}" oninput="document.getElementById('out-${k}').textContent=this.value"></div>`).join('')}</div></div>`}
function radar(x){let vals=BIG.map(([k])=>x['big_'+k]==null?null:Number(x['big_'+k]));if(vals.every(v=>v===null))return '<p class="reportnote">캐릭터 수정에서 Big 5 값을 직접 지정하면 차트가 나타납니다.</p>';vals=vals.map(v=>v??50);let cx=180,cy=165,r=105;const pt=(i,v)=>{let a=-Math.PI/2+i*2*Math.PI/5;return [cx+Math.cos(a)*r*v/100,cy+Math.sin(a)*r*v/100]};const poly=v=>v.map((n,i)=>pt(i,n).join(',')).join(' ');return `<div class="vizcard"><h3>Big 5 성향 레이더</h3><svg viewBox="0 0 360 335" aria-label="직접 입력한 Big 5 성향 레이더 차트">${[20,40,60,80,100].map(n=>`<polygon points="${poly(Array(5).fill(n))}" fill="none" stroke="#e7e2f5"/>`).join('')}${BIG.map((_,i)=>`<line x1="${cx}" y1="${cy}" x2="${pt(i,100)[0]}" y2="${pt(i,100)[1]}" stroke="#ded7f2"/>`).join('')}<polygon points="${poly(vals)}" fill="#a18cf4" fill-opacity=".35" stroke="#6652d2" stroke-width="3"/>${BIG.map(([k,label],i)=>{let [a,b]=pt(i,128);return `<text x="${a}" y="${b}" font-size="12" text-anchor="middle" fill="#554a83">${label}</text>`}).join('')}</svg><div class="legend">${BIG.map(([k,label],i)=>`<span>${label} ${vals[i]}</span>`).join('')}</div><p class="reportnote">창작자 직접 입력 · 진단/자동 판정 아님</p></div>`}
function compareBig(a,b){if(!BIG.some(([k])=>a['big_'+k]!=null&&b['big_'+k]!=null))return '<p class="reportnote">두 캐릭터의 Big 5를 입력하면 성향 비교가 표시됩니다.</p>';return `<div class="vizcard"><h3>두 인물의 성향 비교</h3><div class="legend"><span><i style="background:#6652d2"></i>${esc(a.name)}</span><span><i style="background:#ef83af"></i>${esc(b.name)}</span></div>${BIG.map(([k,label])=>`<div class="rangeitem"><b>${label}</b><div class="meter"><i style="width:${Number(a['big_'+k]??50)}%"></i></div><div class="meter"><i style="width:${Number(b['big_'+k]??50)}%;background:linear-gradient(90deg,#f5b1ce,#ef83af)"></i></div></div>`).join('')}<p class="reportnote">점수는 직접 입력한 창작 설정의 비교이며 궁합 판정이 아닙니다.</p></div>`}
function emotionChart(){let es=db.events.filter(x=>x.intensity!==undefined&&x.intensity!=='').slice().sort((a,b)=>a.date.localeCompare(b.date));if(!es.length)return '<div class="empty">서사 사건을 수정해 감정 강도(0~100)를 기록하면 그래프가 나타납니다.</div>';let w=680,h=265,px=45,py=25,iw=590,ih=185;let points=es.map((x,i)=>[px+(es.length===1?iw/2:i*iw/(es.length-1)),py+ih-(Number(x.intensity)/100)*ih]);return `<div class="vizcard"><h3>감정 강도 흐름</h3><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="서사 사건별 감정 강도 선 그래프">${[0,25,50,75,100].map(v=>`<line x1="${px}" y1="${py+ih-v/100*ih}" x2="${px+iw}" y2="${py+ih-v/100*ih}" stroke="#e9e4f4"/><text x="${px-8}" y="${py+ih-v/100*ih+4}" text-anchor="end" font-size="12" fill="#777">${v}</text>`).join('')}<polyline fill="none" stroke="#7560df" stroke-width="3" stroke-linejoin="round" points="${points.map(p=>p.join(',')).join(' ')}"/>${points.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="#7560df"><title>${esc(es[i].title)}: ${esc(es[i].intensity)}</title></circle><text x="${p[0]}" y="${h-20}" text-anchor="middle" font-size="11" fill="#70688b">${esc(es[i].title.slice(0,7))}</text>`).join('')}</svg><p class="reportnote">각 사건의 감정 강도를 작가가 직접 지정한 기록입니다. 사건은 날짜순으로 연결됩니다.</p></div>`}
function home(){let n=db.characters.length,r=db.relations.length,e=db.events.length;return `<div class="hero"><div class="eyebrow">WELCOME TO YOUR STORYVERSE</div><h2>모든 인물에게는<br>아직 쓰이지 않은 이야기가 있어요.</h2><p>설정 속 작은 단서부터 관계의 결정적인 순간까지. 캐릭터의 내면을 탐구하고, 이야기의 흐름을 체계적으로 기록해 보세요.</p><div class="actions"><button class="primary" onclick="go('characters')">＋ 캐릭터 만들기</button><button onclick="go('relations')" style="background:#ffffff25;color:#fff">관계 연결하기 ↗</button></div></div><div class="statgrid">${[['등록된 캐릭터',n,'characters'],['관계 연결',r,'relations'],['서사 기록',e,'events'],['세계관 / 작품',new Set(db.characters.map(x=>x.work).filter(Boolean)).size,'characters']].map(([t,v,k])=>`<div class="statcard" onclick="go('${k}')" style="cursor:pointer"><div class="micro">${t}</div><div class="metric">${v}</div></div>`).join('')}</div><div class="grid"><div class="panel"><div class="section-kicker">CHARACTERS</div><h2>캐릭터 라이브러리</h2>${db.characters.slice(-4).reverse().map(x=>`<div class="item profile-head"><div class="avatar">${esc(x.name.slice(0,1))}</div><div><b>${esc(x.name)}</b><div class="micro">${esc(x.work||'세계관 미지정')} · ${esc(x.mbti||'유형 미설정')}</div></div></div>`).join('')||'<div class="empty">아직 캐릭터가 없어요. 첫 인물을 등록해 보세요.</div>'}<div class="actions"><button onclick="go('characters')">전체 캐릭터 보기 →</button></div></div><div class="panel"><div class="section-kicker">STORY NOTES</div><h2>최근 서사</h2>${db.events.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,3).map(x=>`<div class="item"><div class="micro">${esc(x.date)} · ${esc(x.category)}</div><b>${esc(x.title)}</b><p class="muted">${esc(x.summary||'내용 없음')}</p></div>`).join('')||'<div class="empty">기록된 사건이 없어요.</div>'}<div class="actions"><button onclick="go('events')">서사 기록하기 →</button></div></div></div>`}
function analysis(){return `<div class="panel"><div class="section-kicker">CHARACTER PSYCHOLOGY</div><h2>🧠 캐릭터 심층 프로파일</h2><p class="muted">인물의 가치관·욕망·두려움·스트레스 반응을 연결해 서사적 심리를 분석합니다. 유형은 직접 설정한 값만 표시하며 자동 판정하지 않습니다.</p>${db.characters.length?`<label>분석 대상</label><select id="target">${opt()}</select><div class="actions"><button class="primary" onclick="showAnalysis()">심층 프로파일 생성 ✦</button></div><div id="result"></div>`:'<div class="empty">먼저 캐릭터를 등록해 주세요.</div>'}</div>`}
function showAnalysis(){const x=char($('#target').value);if(!x)return;const field=(label,v,question)=>`<div class="insight"><b>${label}</b><p>${esc(v||question)}</p></div>`;const tension=x.goal&&x.fear?`이 인물은 '${x.goal}'을(를) 원하지만 '${x.fear}' 때문에 결정적인 선택에서 흔들릴 수 있습니다.`:'목표와 두려움을 모두 기록하면 욕망과 방어기제의 충돌을 살펴볼 수 있습니다.';const arc=x.values&&x.stress?`'${x.values}'이라는 신념이 '${x.stress}' 상황에서 시험받을 때 가장 설득력 있는 성장 장면이 만들어집니다.`:'가치관과 스트레스 반응을 추가하면 신념이 흔들리는 전환점을 설계할 수 있습니다.';$('#result').innerHTML=`<div class="panel" style="background:#fcfbff"><div class="section-kicker">PERSONA REPORT / CREATIVE INTERPRETATION</div><div class="profile-head" style="margin:12px 0 20px"><div class="avatar">${esc(x.name.slice(0,1))}</div><div><h2 style="margin:0">${esc(x.name)}</h2><div class="micro">${esc(x.work||'세계관 미지정')} · ${esc(x.role||'역할 미설정')}</div></div></div><div class="pillbar"><span class="chip">MBTI ${esc(x.mbti||'미설정')}</span><span class="chip">에니어그램 ${esc(x.enneagram||'미설정')}</span><span class="chip">애착 ${esc(x.attachment&&x.attachment!=='미설정'?x.attachment:'미설정')}</span></div>${radar(x)}<h3>01 / 인물의 심리적 중심</h3>${field('표면적 성향',x.traits||x.personality,'성격과 행동을 추가해 주세요.')}${field('핵심 욕망',x.goal,'이 인물이 가장 얻고 싶은 것은 무엇인가요?')}${field('핵심 신념',x.values,'어떤 가치를 지키기 위해 손해를 감수하나요?')}<h3>02 / 내면의 균열</h3>${field('취약점과 방어',x.fear,'가장 두려워하는 것을 기록해 주세요.')}${field('압박 상황의 반응',x.stress,'극심한 스트레스에 어떻게 대응하나요?')}${field('숨겨진 자아',x.secret,'누구에게도 보여주지 않는 감정이 있나요?')}${field('욕망과 두려움의 충돌',tension)}<h3>03 / 서사 설계</h3>${field('성장 아크의 실마리',arc)}<div class="insight"><b>추천 장면 실험</b><p>① 목표를 이루려면 신념을 어겨야 하는 상황<br>② 가장 숨기고 싶은 감정을 타인에게 들키는 상황<br>③ 같은 갈등에서 이전과 반대되는 선택을 하는 상황</p></div><p class="micro">※ AI·심리검사가 아닌 입력 설정 기반의 창작 보조 해석입니다. Big 5는 신뢰할 만한 평가 자료가 없어 임의 점수화하지 않습니다.</p></div>`}
function showRelation(rid){const r=db.relations.find(x=>x.id===rid),a=char(r.a),b=char(r.b);if(!a||!b)return;const common=a.values&&b.values?`A의 가치관: ${a.values} / B의 가치관: ${b.values}`:'두 사람의 가치관을 입력하면 신념 차이를 비교할 수 있습니다.';$('#rel-'+rid).innerHTML=`<div class="insight"><div class="section-kicker">RELATIONSHIP DOSSIER</div><h3>${esc(a.name)} × ${esc(b.name)}</h3><div class="pillbar"><span class="chip">${esc(r.type)}</span><span class="chip">${esc(r.status||'상태 미설정')}</span></div>${compareBig(a,b)}<h3>관계의 핵심</h3><p>${esc(r.desc||'두 사람이 서로에게 어떤 존재인지 기록해 보세요.')}</p><h3>시너지 · 상호 보완</h3><p>${esc(r.strength||'서로가 상대에게 주는 안정감이나 자극을 기록해 보세요.')}</p><h3>갈등의 구조</h3><p>${esc(r.conflict||'각자의 욕망이 충돌하는 장면을 설정해 보세요.')}</p><h3>가치관 비교</h3><p>${esc(common)}</p><h3>전환점</h3><p>${esc(r.turning||'서로를 다르게 바라보게 된 결정적인 사건을 추가해 보세요.')}</p><h3>서사 확장 질문</h3><p>① 한 사람이 비밀을 지키기 위해 상대를 속인다면?<br>② 두 사람이 동일한 사건을 정반대로 해석한다면?<br>③ 관계를 유지하기 위해 누가 먼저 무엇을 포기해야 할까요?</p><p class="micro">궁합은 객관적 점수로 환산하지 않고 관계의 구조를 분석합니다.</p></div>`}

function ai(){return `<div class="ai-hero"><div class="section-kicker">LOREFRAME / INTELLIGENCE LAB</div><h2>✦ AI Creative Studio</h2><p>내 API 키로 새로운 인물을 설계하고, 기존 캐릭터와 관계의 심층 서사를 탐구하세요.</p></div><div class="panel"><h2>01 / AI 연결 설정</h2><p class="ai-note">API 키를 저장하면 계정별로 서버에서 암호화하여 보관합니다. 입력창의 키는 저장 직후 지워집니다. 실제 API 요청 시 선택한 제공업체에 입력한 데이터가 전송되고, 해당 업체 요금이 발생할 수 있습니다. 공유 기기에서는 사용하지 않는 것을 권장합니다.</p><div class="grid"><div><label>AI 제공업체</label><select id="ai-provider" onchange="aiSetProvider(this.value)">${Object.entries(PROVIDERS).map(([k,v])=>`<option value="${k}" ${aiConfig.provider===k?'selected':''}>${v.label}</option>`).join('')}</select></div><div><label>모델 ID (직접 수정 가능)</label><input id="ai-model" value="${esc(aiConfig.model||PROVIDERS[aiConfig.provider].model)}" oninput="aiConfig.model=this.value" autocomplete="off" spellcheck="false"></div></div><label>개인 API 키 · 저장되지 않음</label><div class="grid" style="grid-template-columns:minmax(0,1fr) auto;align-items:end"><input id="ai-key" type="password" placeholder="API 키를 입력하세요" value="${esc(aiConfig.key)}" oninput="aiConfig.key=this.value" autocomplete="off" spellcheck="false"><button type="button" onclick="aiToggleKey()">표시 / 숨김</button></div><div class="ai-actions" style="margin-top:12px"><button onclick="saveProviderKey()">🔐 API 키 저장</button><button onclick="aiTest()">연결 테스트</button><button onclick="aiDiscoverModels()">🔎 사용 가능한 모델 조회</button><button onclick="deleteProviderKey()">연결 삭제</button><button onclick="aiConfig.key='';document.getElementById('ai-key').value='';aiMsg('API 키 입력을 지웠습니다.')">키 지우기</button></div><p class="ai-note" id="ai-hint">${esc(PROVIDERS[aiConfig.provider].hint)}</p><div id="ai-status" class="ai-status" role="status" aria-live="polite">API 키를 입력하면 연결을 테스트할 수 있습니다.</div></div><div class="panel"><h2>02 / 작업 선택</h2><div class="ai-tabs"><button class="${aiMode==='create'?'selected':''}" onclick="aiMode='create';render()">✧ 신규 캐릭터 생성</button><button class="${aiMode==='analyze'?'selected':''}" onclick="aiMode='analyze';render()">◈ 캐릭터 심층 분석</button><button class="${aiMode==='bond'?'selected':''}" onclick="aiMode='bond';render()">♡ 관계 심층 분석</button></div>${aiMode==='create'?`<label>세계관 / 작품</label><input id="ai-world" placeholder="예: 근미래 해양 도시, 판타지 왕국"><label>인물 콘셉트 / 키워드 *</label><textarea id="ai-concept" placeholder="예: 냉철한 의무관. 과거에 누군가를 구하지 못한 죄책감이 있고..." rows="5"></textarea><div class="grid"><div><label>역할</label><input id="ai-role" placeholder="주인공, 라이벌, 조력자"></div><div><label>분위기</label><select id="ai-tone"><option>입체적이고 현실적인</option><option>로맨틱하고 섬세한</option><option>어둡고 비극적인</option><option>유쾌하고 독특한</option><option>서늘하고 미스터리한</option></select></div></div>`:aiMode==='analyze'?`<label>분석할 캐릭터</label>${db.characters.length?`<select id="ai-target">${opt()}</select>`:'<p class="muted">먼저 캐릭터를 등록해 주세요.</p>'}<label>집중 분석할 질문 (선택)</label><textarea id="ai-question" placeholder="예: 이 인물이 사랑을 거부하는 이유와 변화의 계기"></textarea>`:`<label>분석할 관계</label>${db.relations.length?`<select id="ai-relation">${db.relations.map(r=>`<option value="${r.id}">${esc(name(r.a))} × ${esc(name(r.b))} · ${esc(r.type)}</option>`).join('')}</select>`:'<p class="muted">관계 분석 메뉴에서 두 캐릭터를 연결해 주세요.</p>'}<label>집중 분석할 질문 (선택)</label><textarea id="ai-question" placeholder="예: 권력 역전의 계기와 갈등 해결 가능성"></textarea>`}<div class="ai-actions" style="margin-top:16px"><button class="primary" id="ai-generate" onclick="aiGenerate()">✦ ${aiMode==='create'?'캐릭터 생성하기':aiMode==='analyze'?'심층 분석 생성':'관계 리포트 생성'}</button><button onclick="aiCancel()">요청 취소</button></div><p class="ai-note">분석은 창작을 위한 해석이며 임상적 진단이 아닙니다. 생성된 MBTI·애착 유형 등은 가설로 취급하세요.</p></div><div class="panel"><h2>03 / 생성 결과</h2><div id="ai-output">${aiResult?aiResultHtml():'<p class="muted">생성 결과가 여기에 표시됩니다. 결과를 확인하고 수정한 뒤 저장할 수 있어요.</p>'}</div></div>`}
function aiSetProvider(p){aiConfig.provider=p;aiConfig.model=PROVIDERS[p].model;render()}
async function aiDiscoverModels(){
 aiMsg('Gemini 모델 목록을 조회하는 중…');
 try{
  const data=await api('/api/gemini/models');
  if(!data.models?.length)throw Error('이 키로 조회된 Flash 텍스트 모델이 없습니다.');
  const selected=data.models.includes(aiConfig.model)?aiConfig.model:data.models[0];
  const choice=prompt('사용 가능한 모델 ID 목록입니다. 원하는 모델 ID를 복사하거나 입력하세요.\n\n'+data.models.join('\n'),selected);

  if(!data.models.includes(choice.trim()))return aiMsg('목록에 있는 모델 ID를 정확히 입력해 주세요.');
  aiConfig.model=choice.trim();
  const el=document.getElementById('ai-model');if(el)el.value=aiConfig.model;
  aiMsg('모델 선택: '+aiConfig.model+' · 실제 적용하려면 API 키를 입력하고 저장해 주세요.');

}

function aiSafeJson(s){let v=s.trim().replace(/^```(?:json)?\s*/i,'').replace(/```\s*$/,'').trim();try{return JSON.parse(v)}catch{}let start=v.indexOf('{'),end=v.lastIndexOf('}');if(start>=0&&end>start)return JSON.parse(v.slice(start,end+1));throw Error('모델이 JSON 형식으로 답하지 않았습니다. 다시 시도해 주세요.')}

async function aiGenerate(){if(aiBusy)return;let mode=aiMode,payload,system='당신은 한국어 창작 스튜디오 LOREFRAME의 전문 캐릭터·서사 분석가입니다. 캐릭터는 허구 인물입니다. 설정에 없는 사실은 단정하지 않고 가설로 명시합니다. MBTI, 애착 유형, 에니어그램은 임상 진단이 아니라 창작용 해석입니다. 문학적이면서도 구체적인 분석을 작성하세요.';
if(mode==='create'){let concept=$('#ai-concept')?.value.trim();if(!concept)return aiMsg('캐릭터 콘셉트를 입력해 주세요.');payload={world:$('#ai-world').value,concept,role:$('#ai-role').value,tone:$('#ai-tone').value};system+=' 반드시 단일 JSON 객체만 반환하세요. 마크다운 코드블록이나 설명을 덧붙이지 마세요. JSON 키는 name,work,age,role,traits,personality,backstory,values,goal,fear,stress,secret,mbti,enneagram,attachment 입니다. 각 필드는 문자열이고, 서로 모순되지 않도록 풍부하고 독창적인 한국어 설정을 작성하세요. 유형은 가설입니다.'}
else if(mode==='analyze'){let x=char($('#ai-target')?.value);if(!x)return aiMsg('분석할 캐릭터를 먼저 등록해 주세요.');payload={character:x,question:$('#ai-question').value};system+=' 다음 구조로 심층 리포트를 작성하세요: 1. 인물 핵심, 2. 표면과 내면의 간극, 3. 욕망과 두려움, 4. 방어기제와 갈등 반응, 5. 가치관의 모순, 6. 성격 유형 가설과 근거 및 한계, 7. 3단계 성장 아크, 8. 장면 제안 3개. 구체적 근거를 입력에서 인용하되 없는 사실은 가설로 표시하세요.'}
else{let r=db.relations.find(x=>x.id===$('#ai-relation')?.value);if(!r)return aiMsg('관계를 먼저 등록해 주세요.');payload={relation:r,characterA:char(r.a),characterB:char(r.b),question:$('#ai-question').value};system+=' 다음 구조로 관계 심층 리포트를 작성하세요: 1. 관계의 중심, 2. 각자의 시점, 3. 상호 욕망과 결핍, 4. 힘의 균형, 5. 갈등의 기폭제, 6. 애착과 소통 패턴 가설, 7. 관계 발전 3단계, 8. 장면 제안 3개. 임의 궁합 점수는 만들지 마세요.'}
aiBusy=true;aiController=new AbortController();aiMsg('✦ 생성 중… 응답을 기다리고 있습니다.');let btn=$('#ai-generate');if(btn)btn.disabled=true;try{let response=await aiRequest([{role:'system',content:system},{role:'user',content:JSON.stringify(payload)}],aiController.signal);if(mode==='create'){let obj=aiSafeJson(response);if(!obj||typeof obj!=='object'||Array.isArray(obj)||!String(obj.name||'').trim())throw Error('유효한 캐릭터 데이터를 받지 못했습니다. 다시 생성해 주세요.');aiResult={mode,data:obj}}else aiResult={mode,text:response};$('#ai-output').innerHTML=aiResultHtml();aiMsg('✓ 생성 완료 · 내용을 검토한 후 저장하거나 다운로드하세요.');$('#ai-output').scrollIntoView({behavior:'smooth',block:'start'})}catch(e){aiMsg(e.name==='AbortError'?'요청이 취소되었습니다.':'생성 실패: '+e.message)}finally{aiBusy=false;aiController=null;if(btn)btn.disabled=false}}
document.addEventListener('submit',ev=>{if(ev.target.id!=='ai-save-char')return;ev.preventDefault();let v=Object.fromEntries(new FormData(ev.target));if(!v.name?.trim())return alert('캐릭터 이름을 입력해 주세요.');db.characters.push({id:id(),...v});save();aiResult=null;alert('캐릭터 보관함에 저장했습니다.');go('characters')});



// Integrated AI analysis: results are attached to the relevant existing LOREFRAME pages.
const integratedReports={character:{},relation:{},graph:''};
function integratedResultHTML(text){return '<div class="panel ai-report" style="white-space:pre-wrap;margin-top:14px"><div class="section-kicker">GEMINI / 창작 분석</div>'+esc(text)+'</div>'}
async function runIntegratedAI(kind,rid){
 if(!currentUser)return alert('로그인이 필요합니다.');
 let system='당신은 LOREFRAME의 창작 캐릭터 및 관계 분석가입니다. 제공된 프로필과 서사 기록만 근거로 분석하세요. 없는 사실은 창작 가설이라고 명시하세요. MBTI, 에니어그램, 애착유형은 임상 진단이 아니라 창작 참고 가설입니다. 한국어로 구체적이고 구조화된 리포트를 작성하세요.';
 let payload,container,key;
 if(kind==='character'){
  let target=document.getElementById('target');let c=char(target?.value);
  if(!c)return alert('분석할 캐릭터를 선택해 주세요.');
  key=c.id;container=document.getElementById('integrated-character-result');
  payload={character:c,relatedRelations:db.relations.filter(r=>r.a===c.id||r.b===c.id),relatedEvents:db.events.filter(e=>e.character===c.id)};
  system+=' 인물의 표면 성격, 숨겨진 동기, 가치관과 모순, 스트레스 및 방어기제, 인간관계 패턴, 성격 유형 가설(근거와 한계), 서사적 성장과 장면 제안을 분석하세요.';
 }else if(kind==='relation'){
  let r=db.relations.find(x=>x.id===rid);if(!r)return alert('관계를 선택해 주세요.');
  key=rid;container=document.getElementById('rel-'+rid);
  payload={relation:r,characterA:char(r.a),characterB:char(r.b),events:db.events.filter(e=>e.character===r.a||e.character===r.b)};
  system+=' 두 인물의 성격을 비교하고 서로의 욕망, 갈등, 애착과 소통 패턴, 힘의 균형, 관계 전환점, 발전 가능성 및 장면 제안을 구체적으로 분석하세요.';
 }else{
  key='all';container=document.getElementById('integrated-graph-result');
  if(db.characters.length<2)return alert('관계망 분석에는 캐릭터가 2명 이상 필요합니다.');
  payload={characters:db.characters,relations:db.relations,events:db.events};
  system+=' 전체 인물 관계망을 분석하세요. 중심 인물, 관계별 긴장과 동맹, 갈등 전파, 단절된 관계, 잠재적 서사 연결 및 사건 제안을 제시하세요. 등록되지 않은 관계를 사실처럼 단정하지 마세요.';
 }
 if(!container)return alert('분석 화면을 다시 열어 주세요.');
 let old=container.innerHTML;
 if(kind==='relation')container.insertAdjacentHTML('beforeend','<p class="muted" id="integrated-loading">✨ AI가 관계를 분석하고 있습니다…</p>');
 else container.innerHTML='<p class="muted">✨ AI가 프로필과 서사 기록을 분석하고 있습니다…</p>';
 try{
  const result=await aiRequest([{role:'system',content:system},{role:'user',content:JSON.stringify(payload)}]);
  integratedReports[kind][key]=result;
  const html=integratedResultHTML(result);
  if(kind==='relation'){
   let loader=document.getElementById('integrated-loading');if(loader)loader.remove();
   container.insertAdjacentHTML('beforeend',html);
  }else container.innerHTML=html;
 }catch(e){
  if(kind==='relation'){
   let loader=document.getElementById('integrated-loading');if(loader)loader.remove();
   container.insertAdjacentHTML('beforeend','<p class="muted">AI 분석 실패: '+esc(e.message)+'</p>');
  }else container.innerHTML=old+'<p class="muted">AI 분석 실패: '+esc(e.message)+'</p>';
 }
}

async function api(url,opts={}){let r=await fetch(url,{...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'서버 오류');return d}
function setSync(message){let el=document.getElementById('sync-state');if(el)el.textContent=message}
async function accountAction(action){let email=document.getElementById('account-email').value,password=document.getElementById('account-password').value;try{let d=await api('/api/'+action,{method:'POST',body:JSON.stringify({email,password})});currentUser=d.user;await loadWorkspace();}catch(e){document.getElementById('account-message').textContent=e.message}}
async function initAccount(){document.getElementById('account-form').addEventListener('submit',e=>{e.preventDefault();accountAction('login')});try{let d=await api('/api/me');if(d.user){currentUser=d.user;await loadWorkspace()}}catch(e){document.getElementById('account-message').textContent='서버 연결이 필요합니다. README의 실행 방법을 확인해 주세요.'}}
async function loadWorkspace(){let d=await api('/api/data');db=d.data||{characters:[],relations:[],events:[]};document.getElementById('account-overlay').style.display='none';document.querySelector('footer').insertAdjacentHTML('beforeend',` · <span id="sync-state">계정: ${esc(currentUser.email)} · 동기화 준비</span> · <button onclick="logoutAccount()">로그아웃</button>`);render();setSync('클라우드 연결됨')}
async function logoutAccount(){if(syncTimer){clearTimeout(syncTimer);await api('/api/data',{method:'PUT',body:JSON.stringify(db)})}await api('/api/logout',{method:'POST'});location.reload()}
async function saveProviderKey(){let provider=aiConfig.provider,model=(document.getElementById('ai-model')?.value||'').trim(),key=aiConfig.key;aiConfig.model=model;if(!key)return aiMsg('API 키를 입력해 주세요.');try{await api('/api/providers',{method:'POST',body:JSON.stringify({provider,model,key})});aiConfig.key='';document.getElementById('ai-key').value='';aiMsg('✓ API 키를 서버에 암호화해 저장했습니다.')}catch(e){aiMsg('저장 실패: '+e.message)}}
async function deleteProviderKey(){try{await api('/api/providers?provider='+encodeURIComponent(aiConfig.provider),{method:'DELETE'});aiMsg('연결 정보가 삭제되었습니다.')}catch(e){aiMsg(e.message)}}
render();initAccount();
</script></body></html>
